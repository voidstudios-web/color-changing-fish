<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1020">
<meta name="description" content="BonkBrick: play 11 blocky games, build your own obbies, earn Bonks, customize your avatar and hang out with friends.">
<title>BonkBrick</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='14' width='56' height='40' rx='8' fill='%23ff4d4d'/%3E%3Ccircle cx='20' cy='14' r='7' fill='%23ff4d4d'/%3E%3Ccircle cx='44' cy='14' r='7' fill='%23ff4d4d'/%3E%3Crect x='4' y='40' width='56' height='14' rx='6' fill='%23c81e1e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0f1020; --bg2:#14162b; --panel:#1b1e3a; --panel2:#23274a; --line:#2e3360; --text:#f4f5ff; --muted:#9aa0d0;
  --red:#ff4d4d; --red-d:#c81e1e; --yellow:#ffd23f; --yellow-d:#d9a400; --blue:#3da5ff; --blue-d:#1a74c9;
  --green:#3ddc84; --green-d:#1f9e57; --purple:#a66bff; --purple-d:#7038d1; --pink:#ff6bb5; --orange:#ff9f40;
  --radius:16px; --shadow:0 6px 0 rgba(0,0,0,.35); --side:228px; --top:60px; --tab:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eef1ff; --bg2:#e4e8ff; --panel:#ffffff; --panel2:#f2f4ff; --line:#d5daf5; --text:#1b1e3a; --muted:#5d648f;
  --shadow:0 6px 0 rgba(27,30,58,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Fredoka',system-ui,sans-serif;font-size:16px;line-height:1.4;overflow-x:hidden;
  background-image:radial-gradient(circle at 20% -10%,rgba(166,107,255,.15),transparent 40%),radial-gradient(circle at 110% 20%,rgba(61,165,255,.12),transparent 40%);background-attachment:fixed}
a{color:var(--blue);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* ---------- chrome ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:2px solid var(--line);z-index:50}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:22px;color:var(--text);letter-spacing:.5px}
.logo-brick{width:34px;height:26px;background:var(--red);border-radius:6px;position:relative;box-shadow:inset 0 -6px 0 var(--red-d)}
.logo-brick:before,.logo-brick:after{content:"";position:absolute;top:-6px;width:10px;height:8px;background:var(--red);border-radius:4px 4px 0 0}
.logo-brick:before{left:5px}.logo-brick:after{right:5px}
.logo b{color:var(--yellow)}
.top-spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel);border:2px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap}
.bonk-coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,var(--yellow) 45%,var(--yellow-d));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#7a5600;flex:none}
.bonk-coin:after{content:"B"}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.badge-dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.me-btn{width:42px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);overflow:hidden;cursor:pointer;padding:0;flex:none}
.me-btn canvas{width:100%!important;height:100%!important}

.sidebar{position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);padding:16px 12px;border-right:2px solid var(--line);background:var(--bg2);overflow-y:auto;z-index:40}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;color:var(--muted);font-weight:600;font-size:17px;margin-bottom:4px;transition:.15s}
.nav-link svg{width:24px;height:24px;flex:none}
.nav-link:hover{background:var(--panel);color:var(--text)}
.nav-link.active{background:var(--panel2);color:var(--text);box-shadow:inset 4px 0 0 var(--yellow)}
.side-sep{height:2px;background:var(--line);margin:12px 6px}
.tabbar{display:none}
main#view{margin-left:var(--side);padding:calc(var(--top) + 20px) 24px 40px;min-height:100vh;max-width:calc(1240px + var(--side))}

@media (max-width:899px){
  .sidebar{display:none}
  main#view{margin-left:0;padding:calc(var(--top) + 14px) 14px calc(var(--tab) + var(--safe-b) + 20px)}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:2px solid var(--line);z-index:50}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0}
  .tabbar a svg{width:23px;height:23px}
  .tabbar a.active{color:var(--yellow)}
  .logo span{display:none}
  .pill{padding:5px 10px}
}
@media (max-width:380px){ .tabbar a{font-size:9px} .topbar{gap:7px;padding:0 10px} .icon-btn,.me-btn{width:38px;height:38px} }

/* ---------- building blocks ---------- */
h1{font-size:30px;font-weight:700;line-height:1.15}
h2{font-size:22px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h3{font-size:18px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
@media (max-width:520px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px} h1{font-size:25px} }
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:14px;border:none;cursor:pointer;font-weight:600;font-size:16px;
  background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d);transition:transform .08s,box-shadow .08s,filter .15s;white-space:nowrap;user-select:none}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d);color:#06341b}
.btn.yellow{background:var(--yellow);box-shadow:0 4px 0 var(--yellow-d);color:#4a3500}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.ghost{background:var(--panel2);color:var(--text);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px}
.btn.lg{padding:15px 26px;font-size:19px;border-radius:16px}
.btn.block{width:100%}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg2);outline:none;transition:border .15s}
.input:focus{border-color:var(--blue)}
textarea.input{resize:vertical;min-height:90px}
label.lbl{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab.active{background:var(--yellow);border-color:var(--yellow);color:#4a3500}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted);border:1.5px solid var(--line)}
.tag.red{background:rgba(255,77,77,.15);color:var(--red);border-color:rgba(255,77,77,.4)}
.tag.green{background:rgba(61,220,132,.15);color:var(--green);border-color:rgba(61,220,132,.4)}
.tag.yellow{background:rgba(255,210,63,.15);color:var(--yellow);border-color:rgba(255,210,63,.4)}
.tag.blue{background:rgba(61,165,255,.15);color:var(--blue);border-color:rgba(61,165,255,.4)}
.tag.purple{background:rgba(166,107,255,.15);color:var(--purple);border-color:rgba(166,107,255,.4)}
.vbadge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;font-weight:700;vertical-align:middle;margin-left:4px;flex:none}
.pbadge{display:inline-flex;align-items:center;padding:0 6px;height:18px;border-radius:6px;background:linear-gradient(90deg,#38bdf8,#f0abfc);color:#1b1e3a;font-size:11px;font-weight:700;vertical-align:middle;margin-left:4px}
.abadge{display:inline-flex;align-items:center;padding:0 6px;height:18px;border-radius:6px;background:var(--red);color:#fff;font-size:11px;font-weight:700;vertical-align:middle;margin-left:4px}
.uname{font-weight:600;color:var(--text);display:inline-flex;align-items:center;gap:0;min-width:0}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:6px}
.err-box{border:2px dashed var(--red);border-radius:var(--radius);padding:18px;text-align:center;color:var(--muted)}

/* skeletons */
.skel{background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel.card-s{height:210px}.skel.line{height:16px;margin:8px 0}.skel.block{height:120px}

/* game cards */
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .12s;box-shadow:var(--shadow);display:flex;flex-direction:column;color:var(--text)}
.gcard:hover{transform:translateY(-3px)}
.gthumb{aspect-ratio:16/10;position:relative;display:grid;place-items:center;font-size:52px;overflow:hidden}
.gthumb:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.08) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.08) 2px,transparent 2px);background-size:22px 22px;pointer-events:none}
.gthumb .e{filter:drop-shadow(0 4px 0 rgba(0,0,0,.3));z-index:1}
.gbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.gtitle{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmeta{display:flex;gap:10px;color:var(--muted);font-size:13px;font-weight:500}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(170px,200px);gap:14px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}

/* hero */
.hero{border-radius:22px;padding:24px;background:linear-gradient(135deg,#5b3df5,#a66bff 50%,#ff6bb5);color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;right:-40px;bottom:-40px;width:220px;height:220px;background:rgba(255,255,255,.12);border-radius:40px;transform:rotate(18deg)}
.hero > *{position:relative;z-index:1}
.hero h1{font-size:34px}
@media (max-width:520px){.hero{padding:18px}.hero h1{font-size:26px}}

/* list rows */
.urow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--panel);border:2px solid var(--line)}
.urow + .urow{margin-top:8px}
.ava{width:46px;height:46px;border-radius:12px;background:var(--panel2);flex:none;overflow:hidden}
.ava canvas{width:100%!important;height:100%!important}
.ava.sm{width:34px;height:34px;border-radius:9px}
.ava.lg{width:72px;height:72px;border-radius:16px}

/* toasts / modal */
#toasts{position:fixed;top:calc(var(--top) + 10px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600;animation:tin .25s ease-out;pointer-events:auto;display:flex;gap:10px;align-items:center}
.toast.error{border-color:var(--red);background:color-mix(in srgb,var(--red) 18%,var(--panel))}
.toast.success{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--panel))}
.toast.bonk{border-color:var(--yellow);background:color-mix(in srgb,var(--yellow) 16%,var(--panel))}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
.modal-back{position:fixed;inset:0;background:rgba(5,6,18,.7);z-index:200;display:grid;place-items:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:22px;width:min(100%,460px);max-height:88vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.35);animation:pop .2s ease-out}
.modal.wide{width:min(100%,640px)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.menu{position:fixed;top:calc(var(--top) + 4px);right:10px;z-index:120;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px;width:230px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:pop .15s}
.menu a,.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--text);font-weight:600;background:none;border:none;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--panel2)}

/* game overlay */
#game-overlay{position:fixed;inset:0;z-index:150;background:#000;display:none;touch-action:none;user-select:none;-webkit-user-select:none}
#game-overlay.on{display:block}
#game-overlay canvas.gcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.g-hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:8px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));pointer-events:none;z-index:3}
.g-hud .hudtxt{background:rgba(0,0,0,.45);color:#fff;padding:7px 12px;border-radius:12px;font-weight:600;font-size:15px;backdrop-filter:blur(4px)}
.g-hud .g-x{pointer-events:auto;margin-left:auto}
.g-ui{position:absolute;inset:0;pointer-events:none;z-index:2;color:#fff}
.g-ui > *{pointer-events:auto}
.joy{position:absolute;left:22px;bottom:calc(26px + var(--safe-b));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.25);z-index:4;touch-action:none}
.joy .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.gbtns{position:absolute;right:20px;bottom:calc(30px + var(--safe-b));display:flex;gap:14px;align-items:flex-end;z-index:4}
.gbtn{width:76px;height:76px;border-radius:50%;border:none;font-weight:700;font-size:15px;color:#fff;background:rgba(255,77,77,.75);box-shadow:0 5px 0 rgba(0,0,0,.35);touch-action:none}
.gbtn.b2{width:62px;height:62px;background:rgba(61,165,255,.75);margin-bottom:34px}
.gbtn.held{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35);filter:brightness(1.2)}
.g-panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,6,18,.75);z-index:6;padding:16px}
.g-panel .modal{text-align:center}
.no-touch .joy,.no-touch .gbtns{display:none}
.g-side{position:absolute;right:10px;top:64px;bottom:10px;width:min(300px,46vw);overflow-y:auto;display:flex;flex-direction:column;gap:8px;z-index:3}
@media (max-width:640px){.g-side{left:10px;right:10px;width:auto;top:auto;max-height:42%;bottom:calc(10px + var(--safe-b))}.g-side.g-top{top:58px;bottom:auto;max-height:30%}}
.g-card{background:rgba(20,22,43,.88);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 12px;color:#fff}
.g-buy{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;background:rgba(27,30,58,.92);border:2px solid rgba(255,255,255,.12);border-radius:14px;padding:9px 11px;color:#fff;font-weight:600}
.g-buy:disabled{opacity:.5}
.g-buy .gi{font-size:24px;flex:none}

/* editor */
.ed-wrap{display:grid;grid-template-columns:1fr 280px;gap:14px}
@media (max-width:899px){.ed-wrap{grid-template-columns:1fr}}
.ed-canvas{width:100%;height:min(62vh,560px);border-radius:16px;border:2px solid var(--line);background:#0b0c1a;touch-action:none;display:block}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.pal{height:54px;border-radius:12px;border:3px solid transparent;cursor:pointer;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 2px #000;background:var(--panel2)}
.pal.active{border-color:var(--yellow);transform:scale(1.05)}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - var(--top) - 150px);min-height:380px}
@media (max-width:899px){.chat{height:calc(100vh - var(--top) - var(--tab) - 120px)}}
.chat-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg2);border-radius:16px;border:2px solid var(--line)}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--panel2);word-wrap:break-word;white-space:pre-wrap}
.msg.mine{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.msg.theirs{align-self:flex-start;border-bottom-left-radius:5px}
.msg .t{display:block;font-size:11px;opacity:.65;margin-top:2px}

/* forum */
.post{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:14px}
.post + .post{margin-top:10px}
.post-body{white-space:pre-wrap;word-wrap:break-word;margin-top:8px}
.trow{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--text)}
.trow + .trow{margin-top:8px}
.trow:hover{border-color:var(--blue)}

/* shop */
.icard{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);position:relative}
.icard canvas{width:100%!important;aspect-ratio:1!important;border-radius:12px;background:radial-gradient(circle at 50% 40%,var(--panel2),var(--bg2))}
.icard .iname{font-weight:700;font-size:15px;line-height:1.2}
.icard .limited{position:absolute;top:14px;left:14px}
.icard.owned{border-color:var(--green)}
.icard.equipped{border-color:var(--yellow);box-shadow:0 0 0 2px var(--yellow),var(--shadow)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer}
.sw.active{border-color:var(--text)}
.stars{color:var(--yellow);letter-spacing:1px}
.stat{background:var(--panel2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
.lb-row:nth-child(odd){background:var(--panel2)}
.lb-rank{width:28px;text-align:center;font-weight:700;color:var(--muted)}
.lb-row:nth-child(1) .lb-rank{color:var(--yellow)}
.banner{padding:12px 16px;border-radius:14px;background:color-mix(in srgb,var(--yellow) 18%,var(--panel));border:2px solid var(--yellow);margin-bottom:14px;font-weight:500}

.code-list{font-family:ui-monospace,Menlo,monospace;background:var(--bg2);border-radius:12px;padding:12px;white-space:pre;overflow:auto;max-height:260px;font-size:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.tbl-wrap{overflow-x:auto}
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/home"><div class="logo-brick"></div><span>Bonk<b>Brick</b></span></a>
  <div class="top-spacer"></div>
  <div id="top-right" class="row nowrap" style="gap:8px"></div>
</header>
<nav class="sidebar" id="sidebar"></nav>
<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>
<div id="toasts"></div>
<div id="modal-root"></div>
<div id="game-overlay"></div>
<script>
/* =====================================================================
   BonkBrick  |  single-file app. Edit the constants below, then deploy.
   ===================================================================== */
const SUPABASE_URL = 'https://YOUR-PROJECT-REF.supabase.co';
const SUPABASE_ANON_KEY = 'YOUR-SUPABASE-ANON-KEY';
const SELLAUTH_SHOP_URL = 'https://YOUR-SHOP.sellauth.com';           // where people buy Bonks gift cards
const STRIPE_PUBLISHABLE_KEY = 'pk_test_YOUR_PUBLISHABLE_KEY';         // public key, safe in the browser
const STRIPE_FUNCTION_NAME = 'bb_stripe';                              // Supabase Edge Function name
const STRIPE_PLUS_PAYMENT_LINK = '';                                   // optional Stripe Payment Link fallback for Plus
const PLUS_PRICE_LABEL = '$4.99 / month';
const PLATFORM_FEE_PERCENT = 10;                                       // keep in sync with the Edge Function secret
/* ===================================================================== */

const CONFIGURED = /^https:\/\/.+\.supabase\.co/.test(SUPABASE_URL) && !SUPABASE_URL.includes('YOUR-PROJECT') && SUPABASE_ANON_KEY.length > 30;
const sb = CONFIGURED && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
  realtime: { params: { eventsPerSecond: 5 } }
}) : null;

/* ---------------- tiny helpers ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (n) => { n = Number(n) || 0; if (Math.abs(n) >= 1e12) return (n / 1e12).toFixed(1) + 'T'; if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1) + 'B'; if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (Math.abs(n) >= 1e4) return (n / 1e3).toFixed(1) + 'K'; return Math.round(n).toLocaleString(); };
const money = (c) => '$' + (c / 100).toFixed(2);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const todayUTC = () => new Date().toISOString().slice(0, 10);
function ago(t) {
  const s = (Date.now() - new Date(t).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return new Date(t).toLocaleDateString();
}
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('bb_' + k)); localStorage.setItem('bb_' + k, JSON.stringify(v)); } catch (e) { return null; } }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0 || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const isTouch = () => matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function cleanErr(e) {
  const m = (e && (e.message || e.error_description || e.msg)) || String(e || 'Something went wrong');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'Network error. Check your connection.';
  if (/JWT|token is expired/i.test(m)) return 'Your session expired. Please log in again.';
  return m.replace(/^.*?ERROR:\s*/, '').slice(0, 220);
}

/* ---------------- Supabase wrappers ---------------- */
async function rpc(name, args = {}) {
  if (!sb) throw new Error('Backend not configured yet');
  const { data, error } = await sb.rpc(name, args);
  if (error) throw new Error(cleanErr(error));
  return data;
}
async function q(builder) {
  if (!sb) throw new Error('Backend not configured yet');
  const { data, error, count } = await builder;
  if (error) throw new Error(cleanErr(error));
  if (count !== undefined && count !== null) data.__count = count;
  return data;
}
async function callStripe(action, extra = {}) {
  if (!sb) throw new Error('Backend not configured yet');
  const { data, error } = await sb.functions.invoke(STRIPE_FUNCTION_NAME, {
    body: { action, return_base: location.origin + location.pathname, ...extra }
  });
  if (error) {
    let msg = error.message;
    try { const b = await error.context.json(); if (b && b.error) msg = b.error; } catch (e) { }
    if (/Failed to send|not found|404/i.test(msg)) msg = 'Payments are not set up yet (Edge Function missing).';
    throw new Error(msg);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

/* ---------------- toasts + modals ---------------- */
function toast(msg, type = 'info', ms = 3200) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type === 'bonk' ? '<span class="bonk-coin"></span>' : '') + '<span>' + esc(msg) + '</span>';
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, ms);
}
const toastErr = (e) => toast(cleanErr(e), 'error', 4500);
function modal(html, opts = {}) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}">${html}</div>`;
  const close = () => { back.remove(); opts.onClose && opts.onClose(); };
  back.addEventListener('click', e => { if (e.target === back && !opts.sticky) close(); });
  $$('[data-close]', back).forEach(b => b.addEventListener('click', close));
  $('#modal-root').appendChild(back);
  return { el: back.firstElementChild, close };
}
function confirmBox(title, body, okLabel = 'Confirm', danger = false) {
  return new Promise(res => {
    const m = modal(`<h2 style="margin-top:0">${esc(title)}</h2><p class="muted">${body}</p>
      <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button>
      <button class="btn ${danger ? 'red' : 'green'}" id="cb-ok">${esc(okLabel)}</button></div>`, { onClose: () => res(false) });
    $('#cb-ok', m.el).onclick = () => { res(true); m.el.parentElement.remove(); };
  });
}
function promptBox(title, label, value = '', type = 'text') {
  return new Promise(res => {
    const m = modal(`<h2 style="margin-top:0">${esc(title)}</h2><label class="lbl">${esc(label)}</label>
      <input class="input" id="pb-in" type="${type}" value="${esc(value)}">
      <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" data-close>Cancel</button><button class="btn green" id="pb-ok">OK</button></div>`, { onClose: () => res(null) });
    const inp = $('#pb-in', m.el); inp.focus();
    const ok = () => { res(inp.value); m.el.parentElement.remove(); };
    $('#pb-ok', m.el).onclick = ok; inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
}
async function withBusy(btn, fn) {
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.innerHTML = '...'; }
  try { return await fn(); } catch (e) { toastErr(e); } finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = btn.dataset.label; } }
}

/* ---------------- state ---------------- */
const S = {
  session: null, user: null, profile: null, authReady: false,
  items: new Map(), owned: new Set(), counts: { dms: 0, notifications: 0 },
  channel: null, dmListeners: new Set(), games: new Map(), bySlug: new Map()
};
const isAdmin = () => S.profile && S.profile.role === 'admin';
const hasPlus = (p = S.profile) => p && p.plus_until && new Date(p.plus_until) > new Date();
let authReadyResolve; const authReadyP = new Promise(r => authReadyResolve = r);

function badges(p) {
  if (!p) return '';
  return (p.verified ? '<span class="vbadge" title="Verified">&#10003;</span>' : '') +
    (hasPlus(p) ? '<span class="pbadge" title="BonkBrick Plus">PLUS</span>' : '') +
    (p.role === 'admin' ? '<span class="abadge" title="Admin">ADMIN</span>' : '');
}
const uname = (p) => p ? `<a class="uname" href="#/profile/${esc(p.username)}">${esc(p.username)}${badges(p)}</a>` : '<span class="muted">deleted</span>';

/* ---------------- icons ---------------- */
const IC = {
  home: '<path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',
  games: '<rect x="2" y="7" width="20" height="12" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12" r="1.2"/><circle cx="18" cy="15" r="1.2"/>',
  create: '<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',
  shop: '<path d="M5 8h14l-1.2 12H6.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  market: '<path d="M3 9l2-5h14l2 5"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/>',
  forum: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/>',
  friends: '<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><circle cx="17" cy="9" r="3"/><path d="M17 14a5 5 0 0 1 5 5"/>',
  profile: '<rect x="7" y="3" width="10" height="9" rx="2"/><path d="M4 22v-3a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v3"/>',
  bell: '<path d="M18 16V11a6 6 0 0 0-12 0v5l-2 2h16z"/><path d="M10 21h4"/>',
  chat: '<path d="M4 4h16v12H8l-4 4z"/>',
  admin: '<path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/>',
  star: '<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>'
};
const svg = (n, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[n]}</svg>`;
const NAV = [['home', 'Home', '/home'], ['games', 'Games', '/games'], ['create', 'Create', '/create'], ['shop', 'Shop', '/shop'],
['market', 'Market', '/market'], ['forum', 'Forum', '/forum'], ['friends', 'Friends', '/friends'], ['profile', 'Profile', '/profile']];

/* ---------------- router ---------------- */
const routes = [];
const route = (re, fn) => routes.push([re, fn]);
let routeToken = 0, leaveFns = [];
const onLeave = (fn) => leaveFns.push(fn);
const view = () => $('#view');
const nav = (p) => { if (location.hash === '#' + p) handleRoute(); else location.hash = '#' + p; };
function currentPath() { const h = location.hash.slice(1) || '/home'; return h.split('?')[0]; }
function hashQuery() { const h = location.hash; const i = h.indexOf('?'); return new URLSearchParams(i >= 0 ? h.slice(i + 1) : ''); }
function guard() { const t = routeToken; return () => t === routeToken; }

async function handleRoute() {
  const raw = location.hash;
  if (/access_token=|error_description=|type=recovery/.test(raw)) { view().innerHTML = splash('Signing you in...'); return; }
  leaveFns.forEach(f => { try { f(); } catch (e) { } }); leaveFns = [];
  routeToken++;
  $$('.modal-back').forEach(m => m.remove()); $('.menu') && $('.menu').remove();
  const path = currentPath();
  renderNav(path);
  window.scrollTo(0, 0);
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (m) {
      try { await fn(...m.slice(1).map(x => x == null ? undefined : decodeURIComponent(x))); }
      catch (e) { console.error(e); view().innerHTML = errorBox(e, true); }
      return;
    }
  }
  view().innerHTML = `<div class="empty"><div class="big">🧱</div><h2 style="justify-content:center">Page not found</h2><a class="btn" href="#/home">Go home</a></div>`;
}
window.addEventListener('hashchange', handleRoute);

const splash = (t = 'Loading...') => `<div class="splash"><div class="center"><div class="logo-brick bounce" style="margin:0 auto 18px;transform:scale(1.6)"></div><div class="muted">${esc(t)}</div></div></div>`;
function errorBox(e, retry) {
  return `<div class="err-box"><div style="font-size:40px">😵</div><h3>Something broke</h3><p class="small" style="margin:6px 0 12px">${esc(cleanErr(e))}</p>${retry ? '<button class="btn sm" onclick="handleRoute()">Try again</button>' : ''}</div>`;
}
const skelGrid = (n = 8) => `<div class="grid">${Array.from({ length: n }, () => '<div class="skel card-s"></div>').join('')}</div>`;
const skelLines = (n = 5) => Array.from({ length: n }, (_, i) => `<div class="skel line" style="width:${60 + (i * 37) % 40}%"></div>`).join('');
function needLogin(msg = 'Log in to use this page') {
  view().innerHTML = `<div class="empty card" style="max-width:480px;margin:30px auto"><div class="big">🔒</div><h2 style="justify-content:center">${esc(msg)}</h2>
    <p class="muted" style="margin-bottom:16px">${CONFIGURED ? 'Create a free account to earn Bonks, customize your avatar and make friends.' : 'The site owner still needs to connect Supabase. Games work in guest mode.'}</p>
    ${CONFIGURED ? '<a class="btn green lg" href="#/login">Log in or sign up</a>' : '<a class="btn lg" href="#/games">Play as guest</a>'}</div>`;
}
function requireAuth(msg) { if (!S.user || !S.profile) { needLogin(msg); return false; } return true; }

/* ---------------- chrome ---------------- */
function renderNav(path = currentPath()) {
  const seg = '/' + (path.split('/')[1] || 'home');
  const alias = { '/game': '/games', '/play': '/games', '/avatar': '/profile', '/inventory': '/profile', '/sell': '/market', '/messages': '/friends', '/settings': '/profile' };
  const act = alias[seg] || seg;
  const link = ([ic, label, p]) => `<a href="#${p}" class="nav-link ${act === p ? 'active' : ''}">${svg(ic)}<span>${label}</span></a>`;
  $('#sidebar').innerHTML = NAV.map(link).join('') + '<div class="side-sep"></div>' +
    link(['chat', 'Messages', '/messages']) + link(['star', 'Get Bonks', '/redeem']) +
    (isAdmin() ? link(['admin', 'Admin', '/admin']) : '') +
    `<div class="small muted" style="padding:14px">BonkBrick &copy; ${new Date().getFullYear()}<br><a href="#/plus">Plus</a> &middot; <a href="#/settings">Settings</a></div>`;
  $('#tabbar').innerHTML = NAV.map(([ic, label, p]) => `<a href="#${p}" class="${act === p ? 'active' : ''}">${svg(ic)}<span>${label}</span></a>`).join('');
}
function renderTop() {
  const el = $('#top-right');
  if (!S.user || !S.profile) {
    el.innerHTML = CONFIGURED ? `<a class="btn sm green" href="#/login">Log in</a>` : `<span class="tag yellow">Guest mode</span>`;
    return;
  }
  const c = S.counts;
  el.innerHTML = `<a class="pill" href="#/redeem" title="Your Bonks"><span class="bonk-coin"></span><span id="bal">${fmt(S.profile.bonks)}</span></a>
    <a class="icon-btn" href="#/messages" title="Messages">${svg('chat')}${c.dms ? `<span class="badge-dot">${c.dms > 99 ? '99+' : c.dms}</span>` : ''}</a>
    <a class="icon-btn" href="#/notifications" title="Notifications">${svg('bell')}${c.notifications ? `<span class="badge-dot">${c.notifications > 99 ? '99+' : c.notifications}</span>` : ''}</a>
    <button class="me-btn" id="me-btn" title="Menu"></button>`;
  const cv = avatarCanvas(S.profile.avatar, 84, 'head'); $('#me-btn').appendChild(cv);
  $('#me-btn').onclick = (e) => { e.stopPropagation(); toggleMenu(); };
}
function toggleMenu() {
  const old = $('.menu'); if (old) { old.remove(); return; }
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = `<div style="padding:8px 12px 10px;border-bottom:2px solid var(--line);margin-bottom:6px">${uname(S.profile)}<div class="small muted">${fmt(S.profile.bonks)} Bonks</div></div>
    <a href="#/profile">My profile</a><a href="#/avatar">Avatar &amp; inventory</a><a href="#/messages">Messages</a>
    <a href="#/redeem">Get Bonks</a><a href="#/plus">BonkBrick Plus</a><a href="#/sell">Seller dashboard</a><a href="#/settings">Settings</a>
    ${isAdmin() ? '<a href="#/admin">Admin panel</a>' : ''}<button id="m-out" style="color:var(--red)">Log out</button>`;
  document.body.appendChild(m);
  $('#m-out', m).onclick = async () => { m.remove(); await sb.auth.signOut(); toast('Logged out'); nav('/home'); };
  setTimeout(() => document.addEventListener('click', function h(e) { if (!m.contains(e.target)) { m.remove(); } document.removeEventListener('click', h); }), 0);
}
function setBalance(b) { if (S.profile && typeof b === 'number') { S.profile.bonks = b; const el = $('#bal'); if (el) el.textContent = fmt(b); } }

/* ---------------- auth ---------------- */
async function loadItems() {
  if (!sb) { DEFAULT_ITEMS.forEach(it => S.items.set(it.id, it)); return; }
  try {
    const items = await q(sb.from('bb_items').select('*').order('price'));
    S.items.clear(); items.forEach(it => S.items.set(it.id, it));
  } catch (e) { DEFAULT_ITEMS.forEach(it => S.items.set(it.id, it)); }
}
async function loadOwned() {
  S.owned.clear(); if (!S.user) return;
  try { const inv = await q(sb.from('bb_inventory').select('item_id').eq('user_id', S.user.id)); inv.forEach(r => S.owned.add(r.item_id)); } catch (e) { }
}
async function loadProfile() {
  let p = await q(sb.from('bb_profiles').select('*').eq('id', S.user.id).maybeSingle());
  if (!p) {
    const md = S.user.user_metadata || {};
    p = await rpc('bb_ensure_profile', { p_username: md.username || (S.user.email || '').split('@')[0], p_ref: store('ref') || null });
  }
  S.profile = p;
}
async function refreshCounts() {
  if (!S.user) return;
  try { S.counts = await rpc('bb_unread_counts'); renderTop(); } catch (e) { }
}
function subscribeRealtime() {
  unsubscribeRealtime();
  const uid = S.user.id;
  S.channel = sb.channel('bb_user_' + uid)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'bb_messages', filter: `recipient_id=eq.${uid}` }, (p) => {
      S.dmListeners.forEach(fn => fn(p.new));
      if (!location.hash.startsWith('#/messages/')) toast('New message!', 'info');
      refreshCounts();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bb_notifications', filter: `user_id=eq.${uid}` }, (p) => {
      if (p.eventType === 'INSERT' && p.new.type !== 'dm') toast(p.new.title, 'info');
      refreshCounts();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'bb_profiles', filter: `id=eq.${uid}` }, (p) => {
      if (S.profile) { Object.assign(S.profile, p.new); renderTop(); }
    })
    .subscribe();
}
function unsubscribeRealtime() { if (S.channel) { sb.removeChannel(S.channel); S.channel = null; } }

// IMPORTANT: no awaited Supabase calls inside onAuthStateChange (prevents the auth deadlock).
// We only store state here and run DB work in a separate tick.
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    S.session = session; S.user = session ? session.user : null;
    setTimeout(() => afterAuthChange(event), 0);
  });
} else { S.authReady = true; authReadyResolve(); }

let lastUid = undefined;
async function afterAuthChange(event) {
  const uid = S.user ? S.user.id : null;
  if (event === 'PASSWORD_RECOVERY') { history.replaceState(null, '', location.pathname + '#/reset'); }
  const changed = uid !== lastUid;
  if (changed || event === 'USER_UPDATED') {
    lastUid = uid;
    if (uid) {
      try {
        await loadProfile(); await loadOwned();
        if (S.profile.banned) { toast('This account is banned.', 'error', 8000); }
        subscribeRealtime(); refreshCounts();
        maybeDaily();
      } catch (e) { toastErr(e); S.profile = null; }
    } else { S.profile = null; S.owned.clear(); unsubscribeRealtime(); S.counts = { dms: 0, notifications: 0 }; }
    renderTop(); renderNav();
  }
  if (!S.authReady) { S.authReady = true; authReadyResolve(); }
  if (/access_token=|error_description=/.test(location.hash)) {
    if (/error_description=/.test(location.hash)) toast(decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || 'Login link error').replace(/\+/g, ' '), 'error', 6000);
    history.replaceState(null, '', location.pathname + '#/home'); handleRoute();
  } else if (event === 'PASSWORD_RECOVERY') handleRoute();
  else if (changed && S.authReady && event === 'SIGNED_IN' && currentPath() === '/login') nav('/home');
  else if (changed && S.authReady && event !== 'INITIAL_SESSION') handleRoute();
}

function maybeDaily() {
  if (!S.profile || S.profile.banned || S.profile.last_daily === todayUTC() || store('daily_seen') === todayUTC() + S.user.id) return;
  store('daily_seen', todayUTC() + S.user.id);
  const streak = S.profile.last_daily === new Date(Date.now() - 864e5).toISOString().slice(0, 10) ? S.profile.daily_streak + 1 : 1;
  const amt = (25 + Math.min(streak - 1, 7) * 5) * (hasPlus() ? 2 : 1);
  const m = modal(`<div class="center"><div style="font-size:60px" class="bounce">🎁</div><h2 style="justify-content:center;margin-top:6px">Daily reward!</h2>

const GAMES = {}; // slug -> { title, desc, thumb, order, label, controls, make(api) }
function defGame(slug, meta) { GAMES[slug] = meta; }
const isTimeLabel = (row) => row && row.score_order === 'asc';
const fmtScore = (row, s) => s == null ? '-' : isTimeLabel(row) ? Number(s).toFixed(2) + 's' : fmt(s);

async function loadBuiltinGames() {
  if (S.bySlug.size) return;
  const fallback = () => Object.entries(GAMES).filter(([slug]) => !slug.startsWith('__')).forEach(([slug, g]) => S.bySlug.set(slug, { id: null, slug, title: g.title, description: g.desc, thumb: g.thumb, builtin: true, plays: 0, likes: 0, dislikes: 0, favorites: 0, score_order: g.order, score_label: g.label }));
  if (!sb) return fallback();
  try {
    const rows = await q(sb.from('bb_games').select('id,slug,title,description,thumb,builtin,plays,likes,dislikes,favorites,score_order,score_label,created_at').eq('builtin', true));
    if (!rows.length) return fallback();
    rows.forEach(r => { S.bySlug.set(r.slug, r); S.games.set(r.id, r); });
  } catch (e) { fallback(); }
}
const builtinList = () => Object.keys(GAMES).filter(s => !s.startsWith('__')).map(s => S.bySlug.get(s)).filter(Boolean);
function thumbHTML(t, big) {
  t = t || {}; const c1 = /^#[0-9a-f]{6}$/i.test(t.c1) ? t.c1 : '#3da5ff', c2 = /^#[0-9a-f]{6}$/i.test(t.c2) ? t.c2 : '#1e1b4b';
  return `<div class="gthumb" style="background:linear-gradient(135deg,${c1},${c2});${big ? 'font-size:96px;border-radius:18px' : ''}"><span class="e">${esc((t.e || '🧱').slice(0, 4))}</span></div>`;
}
function gameCard(g) {
  const key = g.builtin ? g.slug : g.id, total = (g.likes || 0) + (g.dislikes || 0);
  const pct = total ? Math.round(g.likes / total * 100) + '%' : 'New';
  return `<a class="gcard" href="#/game/${esc(key)}">${thumbHTML(g.thumb)}<div class="gbody"><div class="gtitle">${esc(g.title)}</div>
    ${g.creator ? `<div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">by ${esc(g.creator.username)}</div>` : ''}
    <div class="gmeta"><span>👍 ${pct}</span><span>▶ ${fmt(g.plays)}</span></div></div></a>`;
}

function genObby(seed) {
  const R = rng(seed), W = 230, H = 24, g = Array.from({ length: H }, () => Array(W).fill('.'));
  const set = (x, y, c) => { if (x >= 0 && x < W && y >= 0 && y < H) g[y][x] = c; };
  const plat = (x, y, len, c = '#') => { for (let i = 0; i < len; i++) set(x + i, y, c); };
  const cols = 'abcdefg';
  let x = 0, y = 17, lastCP = 0;
  plat(0, y, 9); plat(0, y + 1, 9); set(2, y - 1, 'S'); x = 9;
  while (x < W - 16) {
    const kind = ['gap', 'gap', 'pillars', 'lava', 'stairs', 'pad', 'kill', 'coinrun'][Math.floor(R() * 8)], col = cols[Math.floor(R() * cols.length)];
    if (kind === 'gap') { x += 2 + Math.floor(R() * 2); y = clamp(y + Math.floor(R() * 5) - 2, 9, 19); const len = 3 + Math.floor(R() * 3); plat(x, y, len, col); if (R() > .5) set(x + 1, y - 2, 'O'); x += len; }
    else if (kind === 'pillars') { for (let i = 0; i < 4; i++) { x += 2 + (R() > .6 ? 1 : 0); y = clamp(y + Math.floor(R() * 3) - 1, 9, 19); set(x, y, col); set(x, y + 1, col); x += 1; } x += 1; y = clamp(y, 9, 19); plat(x, y, 3); x += 3; }
    else if (kind === 'lava') { x += 1; for (let i = 0; i < 4; i++) { set(x, y, col); x++; set(x, y + 1, 'K'); set(x + 1, y + 1, 'K'); x += 2; } plat(x, y, 3); x += 3; }
    else if (kind === 'stairs') { x += 2; for (let i = 0; i < 4 && y > 9; i++) { y -= 1; plat(x, y, 2, col); x += 3; } plat(x, y, 3); x += 3; }
    else if (kind === 'pad') { x += 2; plat(x, y, 3, col); set(x + 2, y, 'J'); x += 6; y = clamp(y - 6, 6, 19); plat(x, y, 5); set(x + 2, y - 2, 'O'); set(x + 3, y - 2, 'O'); x += 5; }
    else if (kind === 'kill') { x += 2; plat(x, y, 8, col); set(x + 3, y - 1, 'K'); set(x + 6, y - 1, 'K'); set(x + 6, y - 2, 'K'); x += 8; }
    else if (kind === 'coinrun') { x += 2; plat(x, y, 7, col); for (let i = 1; i < 6; i++) set(x + i, y - 3, 'O'); x += 7; }
    if (x - lastCP > 34 && g[y][x - 2] !== '.') { set(x - 2, y - 1, 'C'); lastCP = x; }
  }
  x += 2; plat(x, y, 8); plat(x, y + 1, 8); set(x + 5, y - 1, 'F'); set(x + 5, y - 2, 'F');

}
function genTower(seed) {
  const R = rng(seed), W = 16, H = 420, g = Array.from({ length: H }, () => Array(W).fill('.'));
  for (let y = 0; y < H; y++) { g[y][0] = '#'; g[y][W - 1] = '#'; }
  for (let x = 0; x < W; x++) { g[H - 1][x] = '#'; g[H - 2][x] = '#'; }
  g[H - 3][7] = 'S';
  let px = 5, pw = 6, cnt = 0;
  for (let y = H - 5; y > 6; y -= 3) {
    cnt++;
    const w = Math.max(2, 6 - Math.floor(cnt / 25) - Math.floor(R() * 2));
    let nx = px + Math.floor(R() * (pw + w + 4)) - (w + 2); nx = clamp(nx, 1, W - 1 - w);
    const col = 'abcdefgh'[Math.floor(cnt / 12) % 8];
    for (let i = 0; i < w; i++) g[y][nx + i] = col;
    if (cnt > 8 && R() < .18 && w > 2) g[y][nx + Math.floor(R() * w)] = 'K';
    if (R() < .25) g[y - 1][nx + Math.floor(w / 2)] = 'O';
    if (cnt % 30 === 0) g[y - 1][nx] = 'C';
    px = nx; pw = w;
  }
  for (let x = 1; x < W - 1; x++) g[4][x] = '#'; g[3][7] = 'F';
  return { v: 1, w: W, h: H, rows: g.map(r => r.join('')) };
}

function genMaze(n, seed) {
  const R = rng(seed), S2 = n * 2 + 1, g = Array.from({ length: S2 }, () => Array(S2).fill(1));
  const st = [[0, 0]], seen = new Set(['0,0']); g[1][1] = 0;
  while (st.length) {
    const [cx, cy] = st[st.length - 1];
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < n && y < n && !seen.has(x + ',' + y));
    if (!nb.length) { st.pop(); continue; }
    const [nx, ny, dx, dy] = nb[Math.floor(R() * nb.length)];
    g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; g[ny * 2 + 1][nx * 2 + 1] = 0; seen.add(nx + ',' + ny); st.push([nx, ny]);
  }
  // a few loops so it is not a pure tree
  for (let i = 0; i < n; i++) { const x = 1 + Math.floor(R() * (S2 - 2)), y = 1 + Math.floor(R() * (S2 - 2)); if ((x + y) % 2 === 1) g[y][x] = 0; }
  return g;
}

/* =====================================================================
   shared top-down helpers
   ===================================================================== */
function arenaFloor(ctx, W, H, cam, AW, AH, c1, c2) {
  ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  for (let y = 0; y < AH; y += 60) for (let x = 0; x < AW; x += 60) { ctx.fillStyle = ((x + y) / 60) % 2 ? c1 : c2; ctx.fillRect(x, y, 60, 60); }
  ctx.restore();
}
function moveAxis(inp) { let mx = inp.ax, my = inp.ay; const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; } return [mx, my, l]; }
function hpBar(ctx, x, y, w, v, col = '#22c55e') { ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x - w / 2, y, w, 6); ctx.fillStyle = col; ctx.fillRect(x - w / 2, y, w * clamp(v, 0, 1), 6); }

  make: (api) => {

    const pl = { x: AW / 2, y: AH - 150, hp: 100, ang: -Math.PI / 2, cd: 0, swing: 0, dash: 0, dcd: 0, inv: 0 };
    let bots = [], wave = 0, kills = 0, cam = { x: 0, y: 0 }, fx = [], over = false, waveT = 1.5, pickups = [];
    const startWave = () => { wave++; const n = Math.min(7, 1 + wave); for (let i = 0; i < n; i++) { const e = i % 4; bots.push({ x: e === 0 ? 80 : e === 1 ? AW - 80 : 200 + Math.random() * 1000, y: e < 2 ? 100 + Math.random() * 800 : (e === 2 ? 80 : AH - 80), hp: 60 + wave * 12, max: 60 + wave * 12, ang: 0, wind: 0, cd: 1 + Math.random(), kb: { x: 0, y: 0 }, col: botCol(wave * 10 + i), name: BOT_NAMES[(wave + i) % BOT_NAMES.length], spd: 120 + Math.min(80, wave * 8) + Math.random() * 30 }); } api.toast('Wave ' + wave, 'info', 1200); };
    const arcHit = (ax, ay, ang, tx, ty, range, spread) => { const d = Math.hypot(tx - ax, ty - ay); if (d > range) return false; let da = Math.atan2(ty - ay, tx - ax) - ang; da = Math.atan2(Math.sin(da), Math.cos(da)); return Math.abs(da) < spread; };
    return {
      update(dt) {
        if (over) return; const inp = api.input; const [mx, my, l] = moveAxis(inp);
        if (l > .1) pl.ang = Math.atan2(my, mx);
        if (!isTouch() && inp.ptr.hover) pl.ang = Math.atan2(inp.ptr.y + cam.y - pl.y, inp.ptr.x + cam.x - pl.x);
        pl.dcd -= dt; pl.cd -= dt; pl.swing -= dt; pl.inv -= dt;

        const sp = pl.dash > 0 ? 720 : 230; pl.dash -= dt;
        const dx = pl.dash > 0 ? Math.cos(pl.ang) : mx, dy = pl.dash > 0 ? Math.sin(pl.ang) : my;
        pl.x += dx * sp * dt; pl.y += dy * sp * dt; pushOutRects(pl, 18, walls);
        if ((inp.aP || (inp.ptr.down && !isTouch())) && pl.cd <= 0) {

          for (const b of bots) if (arcHit(pl.x, pl.y, pl.ang, b.x, b.y, 78, 1.0)) { b.hp -= 34; b.kb.x = Math.cos(pl.ang) * 420; b.kb.y = Math.sin(pl.ang) * 420; b.wind = 0; fx.push({ x: b.x, y: b.y, t: .3, txt: '-34' }); }
        }
        for (const b of bots) {

          if (b.wind > 0) { b.wind -= dt; if (b.wind <= 0) { if (arcHit(b.x, b.y, b.ang, pl.x, pl.y, 76, .9) && pl.inv <= 0) { pl.hp -= 10 + wave; pl.inv = .4; fx.push({ x: pl.x, y: pl.y, t: .4, txt: 'OUCH', c: '#f87171' }); } b.cd = 1 + Math.random() * .7; b.swing = .16; } }

          b.swing = (b.swing || 0) - dt;

        }
        for (let i = 0; i < bots.length; i++) for (let j = i + 1; j < bots.length; j++) { const a = bots[i], c = bots[j], d = Math.hypot(a.x - c.x, a.y - c.y) || 1; if (d < 38) { const push = (38 - d) / 2; a.x -= (c.x - a.x) / d * push; a.y -= (c.y - a.y) / d * push; c.x += (c.x - a.x) / d * push; c.y += (c.y - a.y) / d * push; } }
        const dead = bots.filter(b => b.hp <= 0); kills += dead.length; dead.forEach(b => { fx.push({ x: b.x, y: b.y, t: .6, txt: 'KO!', c: '#facc15' }); if (Math.random() < .3) pickups.push({ x: b.x, y: b.y }); });
        bots = bots.filter(b => b.hp > 0);
        pickups = pickups.filter(p => { if (Math.hypot(p.x - pl.x, p.y - pl.y) < 30) { pl.hp = Math.min(100, pl.hp + 25); fx.push({ x: pl.x, y: pl.y, t: .5, txt: '+25', c: '#4ade80' }); return false; } return true; });
        fx.forEach(f => { f.t -= dt; f.y -= 40 * dt; }); fx = fx.filter(f => f.t > 0);
        if (!bots.length) { waveT -= dt; if (waveT <= 0) { waveT = 2.5; pl.hp = Math.min(100, pl.hp + 15); startWave(); } }
        if (pl.hp <= 0) { over = true; api.end(kills, { title: 'Defeated!', emoji: '⚔️', msg: `You survived ${wave} waves.` }); }
      },
      draw(ctx) {

const PCOLS = 'id,username,avatar,verified,plus_until,role,bio,created_at,banned';
function userRow(p, actions = '') {
  return `<div class="urow">${avaHTML(p && p.avatar)}<div class="grow" style="min-width:0">${uname(p)}<div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc((p && p.bio) || 'Joined ' + (p ? fmtDate(p.created_at) : ''))}</div></div><div class="row" style="gap:6px">${actions}</div></div>`;

route(/^\/friends$/, async () => {
  if (!requireAuth('Log in to see your friends')) return;
  let tab = hashQuery().get('tab') || 'friends';
  view().innerHTML = `<div class="spread"><h1>Friends</h1><a class="btn" href="#/messages">💬 Messages</a></div><div class="tabs" id="f-tabs" style="margin-top:14px"></div><div id="f-body">${skelLines(5)}</div>`;
  const ok = guard(), uid = S.user.id;
  const FR = `*,r:bb_profiles!bb_friendships_requester_id_fkey(${PCOLS}),a:bb_profiles!bb_friendships_addressee_id_fkey(${PCOLS})`;
  const draw = async () => {
    const tabs = [['friends', 'Friends'], ['requests', 'Requests'], ['find', 'Find people'], ['followers', 'Followers'], ['following', 'Following'], ['blocked', 'Blocked']];
    $('#f-tabs').innerHTML = tabs.map(([k, l]) => `<button class="tab ${k === tab ? 'active' : ''}" data-t="${k}">${l}</button>`).join('');
    $$('#f-tabs .tab').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
    const el = $('#f-body'); el.innerHTML = skelLines(5);
    try {
      if (tab === 'friends' || tab === 'requests') {
        const rows = await q(sb.from('bb_friendships').select(FR).order('created_at', { ascending: false }));
        if (!ok()) return;
        if (tab === 'friends') {
          const fr = rows.filter(r => r.status === 'accepted').map(r => r.requester_id === uid ? r.a : r.r);
          el.innerHTML = fr.length ? fr.map(p => userRow(p, `<a class="btn sm" href="#/messages/${esc(p.username)}">Chat</a><button class="btn ghost sm" data-unf="${p.id}">Remove</button>`)).join('') : `<div class="empty"><div class="big">👋</div>No friends yet. Try the Find people tab!</div>`;
        } else {
          const inc = rows.filter(r => r.status === 'pending' && r.addressee_id === uid), out = rows.filter(r => r.status === 'pending' && r.requester_id === uid);
          el.innerHTML = `<h3>Incoming</h3><div style="margin:8px 0 18px">${inc.length ? inc.map(r => userRow(r.r, `<button class="btn green sm" data-acc="${r.id}">Accept</button><button class="btn ghost sm" data-dec="${r.id}">Decline</button>`)).join('') : '<div class="muted small">No requests.</div>'}</div>
            <h3>Sent</h3><div style="margin-top:8px">${out.length ? out.map(r => userRow(r.a, `<button class="btn ghost sm" data-unf="${r.a.id}">Cancel</button>`)).join('') : '<div class="muted small">Nothing pending.</div>'}</div>`;
        }
      } else if (tab === 'find') {
        el.innerHTML = `<input class="input" id="f-q" placeholder="Search usernames..." style="max-width:380px;margin-bottom:12px"><div id="f-res"></div>`;
        const run = async (s) => {
          let b = sb.from('bb_profiles').select(PCOLS).neq('id', uid).eq('banned', false);
          b = s ? b.ilike('username', '%' + s.replace(/[\\%_]/g, c => '\\' + c) + '%') : b.order('created_at', { ascending: false });
          const res = await q(b.limit(30)); if (!ok()) return;
          $('#f-res').innerHTML = res.length ? res.map(p => userRow(p, `<a class="btn ghost sm" href="#/profile/${esc(p.username)}">View</a><button class="btn green sm" data-add="${p.id}">Add</button>`)).join('') : '<div class="muted">No users found.</div>';
          bind();
        };
        let t; $('#f-q').oninput = e => { clearTimeout(t); t = setTimeout(() => run(e.target.value.trim()), 300); }; run('');
        return;
      } else if (tab === 'followers' || tab === 'following') {
        const rows = tab === 'followers' ? await q(sb.from('bb_follows').select(`p:bb_profiles!bb_follows_follower_id_fkey(${PCOLS})`).eq('following_id', uid))
          : await q(sb.from('bb_follows').select(`p:bb_profiles!bb_follows_following_id_fkey(${PCOLS})`).eq('follower_id', uid));
        if (!ok()) return;
        el.innerHTML = rows.length ? rows.map(r => userRow(r.p, `<a class="btn ghost sm" href="#/profile/${esc(r.p.username)}">View</a>${tab === 'following' ? `<button class="btn ghost sm" data-unfol="${r.p.id}">Unfollow</button>` : ''}`)).join('') : `<div class="empty"><div class="big">👀</div>Nobody here yet.</div>`;
      } else {
        const rows = await q(sb.from('bb_blocks').select(`p:bb_profiles!bb_blocks_blocked_id_fkey(${PCOLS})`).eq('blocker_id', uid));
        if (!ok()) return;
        el.innerHTML = rows.length ? rows.map(r => userRow(r.p, `<button class="btn ghost sm" data-unb="${r.p.id}">Unblock</button>`)).join('') : `<div class="empty"><div class="big">🕊️</div>You haven't blocked anyone.</div>`;
      }
      bind();
    } catch (e) { if (ok()) el.innerHTML = errorBox(e, true); }
  };
  const bind = () => {
    $$('[data-acc]').forEach(b => b.onclick = () => withBusy(b, async () => { await rpc('bb_friend_respond', { p_request: b.dataset.acc, p_accept: true }); toast('Friend added!', 'success'); draw(); }));
    $$('[data-dec]').forEach(b => b.onclick = () => withBusy(b, async () => { await rpc('bb_friend_respond', { p_request: b.dataset.dec, p_accept: false }); draw(); }));
    $$('[data-unf]').forEach(b => b.onclick = () => withBusy(b, async () => { await rpc('bb_friend_remove', { p_user: b.dataset.unf }); draw(); }));
    $$('[data-add]').forEach(b => b.onclick = () => withBusy(b, async () => { const r = await rpc('bb_friend_request', { p_user: b.dataset.add }); toast(r === 'friends' ? 'You are now friends!' : 'Friend request sent', 'success'); b.textContent = r === 'friends' ? 'Friends' : 'Sent'; b.disabled = true; }));
    $$('[data-unfol]').forEach(b => b.onclick = () => withBusy(b, async () => { await rpc('bb_toggle_follow', { p_user: b.dataset.unfol }); draw(); }));
    $$('[data-unb]').forEach(b => b.onclick = () => withBusy(b, async () => { await rpc('bb_toggle_block', { p_user: b.dataset.unb }); toast('Unblocked'); draw(); }));
  };
  draw();
});

route(/^\/messages\/([A-Za-z0-9_]{1,20})$/, async (name) => {
  if (!requireAuth('Log in to chat')) return;
  view().innerHTML = `<div class="skel" style="height:60vh"></div>`;
  const ok = guard();
  const o = await q(sb.from('bb_profiles').select(PCOLS).eq('username', name).maybeSingle());
  if (!ok()) return;
  if (!o) { view().innerHTML = `<div class="empty"><div class="big">🔍</div>User not found.</div>`; return; }
  if (o.id === S.user.id) { nav('/messages'); return; }
  const me = S.user.id;
  view().innerHTML = `<div class="chat"><div class="row nowrap" style="margin-bottom:10px"><a class="btn ghost sm" href="#/messages">←</a>${avaHTML(o.avatar, 'sm')}<div class="grow">${uname(o)}</div><button class="btn ghost sm" id="c-blk">Block</button></div>
    <div class="chat-log" id="c-log">${skelLines(4)}</div>
    <form class="row nowrap" id="c-form" style="margin-top:10px"><input class="input" id="c-in" placeholder="Message ${esc(o.username)}..." maxlength="2000" autocomplete="off"><button class="btn" type="submit">Send</button></form></div>`;
  const log = $('#c-log'), seen = new Set();
  const add = (m, scroll = true) => {
    if (seen.has(m.id)) return; seen.add(m.id);
    const d = document.createElement('div'); d.className = 'msg ' + (m.sender_id === me ? 'mine' : 'theirs');
    d.innerHTML = `${esc(m.body)}<span class="t">${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>`;
    log.appendChild(d); if (scroll) log.scrollTop = log.scrollHeight;
  };
  try {
    const msgs = await q(sb.from('bb_messages').select('*').or(`and(sender_id.eq.${me},recipient_id.eq.${o.id}),and(sender_id.eq.${o.id},recipient_id.eq.${me})`).order('created_at', { ascending: false }).limit(150));
    if (!ok()) return;
    log.innerHTML = msgs.length ? '' : `<div class="empty" id="c-empty">Say hi to ${esc(o.username)}! 👋</div>`;
    msgs.reverse().forEach(m => add(m, false)); log.scrollTop = log.scrollHeight;
    rpc('bb_mark_read', { p_other: o.id }).then(refreshCounts).catch(() => { });
  } catch (e) { log.innerHTML = errorBox(e, true); }
  const blk = await q(sb.from('bb_blocks').select('blocked_id').eq('blocker_id', me).eq('blocked_id', o.id).maybeSingle()).catch(() => null);
  if (!ok()) return;
  $('#c-blk').textContent = blk ? 'Unblock' : 'Block';
  $('#c-blk').onclick = (e) => withBusy(e.target, async () => { const b = await rpc('bb_toggle_block', { p_user: o.id }); toast(b ? 'Blocked. They can no longer message you.' : 'Unblocked'); e.target.dataset.label = b ? 'Unblock' : 'Block'; });
  const listener = (m) => { if (m.sender_id === o.id) { const em = $('#c-empty'); if (em) em.remove(); add(m); rpc('bb_mark_read', { p_other: o.id }).then(refreshCounts).catch(() => { }); } };
  S.dmListeners.add(listener); onLeave(() => S.dmListeners.delete(listener));
  // fallback poll in case Realtime is not enabled on the project
  const poll = setInterval(async () => {
    try { const fresh = await q(sb.from('bb_messages').select('*').eq('sender_id', o.id).eq('recipient_id', me).is('read_at', null).order('created_at')); fresh.forEach(listener); } catch (e) { }
  }, 15000);
  onLeave(() => clearInterval(poll));
  $('#c-form').onsubmit = async (e) => {
    e.preventDefault(); const inp = $('#c-in'), body = inp.value.trim(); if (!body) return;
    inp.value = ''; inp.focus();
    try { const m = await rpc('bb_send_message', { p_to: o.id, p_body: body }); const em = $('#c-empty'); if (em) em.remove(); add(m); }
    catch (err) { inp.value = body; toastErr(err); }
  };
  $('#c-in').focus();
});

        <button class="btn green lg block" style="margin-top:18px" type="submit">${mode === 'signup' ? 'Create account' : mode === 'forgot' ? 'Send reset link' : 'Log in'}</button></form>
      <div class="center small" style="margin-top:14px">${mode === 'login' ? `New here? <a href="#" data-m="signup">Create an account</a> &middot; <a href="#" data-m="forgot">Forgot password?</a>` : `<a href="#" data-m="login">Back to log in</a>`}</div></div>`;

      <label class="lbl">New password</label><div class="row nowrap"><input class="input" type="password" id="st-pass" minlength="6"><button class="btn sm" id="st-pass-go">Change</button></div>
      <button class="btn red block" id="st-out" style="margin-top:18px">Log out</button></div>` : `<div class="card"><h3>Account</h3><p class="muted">Not logged in.</p>${CONFIGURED ? '<a class="btn" href="#/login">Log in</a>' : ''}</div>`}
    <div class="card flat"><h3>About</h3><p class="muted small" style="margin-top:6px">BonkBrick is a fan-made blocky game platform. Bonks have no cash value and cannot be withdrawn. Marketplace payments are handled by Stripe.</p></div></div>`;
  $$('[data-th]').forEach(b => b.onclick = () => { document.documentElement.dataset.theme = b.dataset.th; store('theme', b.dataset.th); handleRoute(); });
  if (!S.profile) return;
  $('#st-bio-go').onclick = (e) => withBusy(e.target, async () => { const v = $('#st-bio').value; await rpc('bb_update_profile', { p_bio: v }); S.profile.bio = v; toast('Saved', 'success'); });
  $('#st-pass-go').onclick = (e) => withBusy(e.target, async () => { const v = $('#st-pass').value; if (v.length < 6) throw new Error('At least 6 characters'); const { error } = await sb.auth.updateUser({ password: v }); if (error) throw new Error(error.message); $('#st-pass').value = ''; toast('Password changed', 'success'); });
  $('#st-out').onclick = async () => { await sb.auth.signOut(); toast('Logged out'); nav('/home'); };
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  const th = store('theme'); if (th) document.documentElement.dataset.theme = th;
  renderNav(); renderTop(); view().innerHTML = splash();
  const items = loadItems();
  await Promise.race([authReadyP, sleep(5000)]);
  await items.catch(() => { });
  renderTop(); renderNav();
  handleRoute();
  if (sb) { rpc('bb_ping').catch(() => { }); setInterval(() => { if (S.user && document.visibilityState === 'visible') refreshCounts(); }, 60000); }
  window.addEventListener('error', (e) => { if (e.message && !/ResizeObserver|Script error/.test(e.message)) console.warn(e.message); });
  window.addEventListener('unhandledrejection', (e) => { console.warn(e.reason); });
})();
</script>
</body>
