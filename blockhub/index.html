<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2d7ff9">
<title>Blockhub</title>
<meta name="description" content="Play blocky browser games, build your own, earn Bux and hang out with friends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --blue:#2d7ff9; --blue-d:#1a5fd0; --yellow:#ffd23f; --red:#ff4d4d; --green:#22c55e; --purple:#7b2ff7; --orange:#ff8c1a;
  --ink:#1b1f3b; --ink2:#4a5072; --bg:#eef3ff; --card:#ffffff; --line:#1b1f3b; --soft:#dfe7fb;
  --r:14px; --shadow:0 5px 0 var(--line);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
a{color:var(--blue-d)}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:.2em 0 .5em;line-height:1.15}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
.muted{color:var(--ink2)} .small{font-size:.85rem} .center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1}
.stack>*+*{margin-top:12px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--blue);border-bottom:4px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:10px}
.logo{font-weight:700;font-size:1.35rem;color:#fff;text-decoration:none;letter-spacing:.5px;display:flex;align-items:center;gap:6px;
  text-shadow:0 3px 0 var(--line)}
.logo i{display:inline-block;width:22px;height:22px;background:var(--yellow);border:3px solid var(--line);border-radius:5px;transform:rotate(-8deg)}
.bux{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--yellow);border:3px solid var(--line);border-radius:999px;
  padding:3px 12px 3px 5px;font-weight:700;text-decoration:none;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.coin{width:20px;height:20px;border-radius:50%;background:#ffb703;border:3px solid var(--line);display:inline-block;position:relative}
.coin:after{content:"B";position:absolute;inset:0;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.me{width:38px;height:38px;border-radius:10px;border:3px solid var(--line);background:#fff;overflow:hidden;display:block}
.me img{width:100%;height:100%;display:block}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:4px solid var(--line);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.72rem;padding:4px 0;border-radius:10px}
.nav a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
.nav a.on{color:var(--blue);background:var(--soft)}
.dot{display:inline-block;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);color:#fff;font-size:.7rem;line-height:16px;vertical-align:top}
/* layout */
main{max-width:980px;margin:0 auto;padding:14px 12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card+.card{margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:3px solid var(--line);border-radius:12px;
  background:var(--blue);color:#fff;font-weight:700;padding:10px 16px;cursor:pointer;box-shadow:0 4px 0 var(--line);
  text-decoration:none;transition:transform .05s;min-height:44px;user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.y{background:var(--yellow);color:var(--ink)} .btn.g{background:var(--green)} .btn.r{background:var(--red)}
.btn.p{background:var(--purple)} .btn.w{background:#fff;color:var(--ink)} .btn.o{background:var(--orange)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.88rem;box-shadow:0 3px 0 var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea,select{
  width:100%;border:3px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
textarea{min-height:90px;resize:vertical}
label{font-weight:600;display:block;margin-bottom:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:3px solid var(--line);border-radius:999px;padding:5px 14px;background:#fff;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.tab.on{background:var(--yellow)}
/* game grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.gcard{background:#fff;border:3px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;text-decoration:none;color:var(--ink);display:block}
.gcard .th{aspect-ratio:4/3;background:var(--soft);border-bottom:3px solid var(--line);overflow:hidden;position:relative}
.gcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .meta{padding:8px 10px}
.gcard b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{position:absolute;top:6px;left:6px;background:var(--yellow);border:2px solid var(--line);border-radius:8px;font-size:.72rem;font-weight:700;padding:1px 6px}
.hero{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border:3px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
.hero h1{text-shadow:0 3px 0 var(--line)}
.hero:after{content:"";position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:var(--yellow);border:3px solid var(--line);border-radius:18px;transform:rotate(18deg);opacity:.9}
.hero>*{position:relative;z-index:1}
/* play */
.play{max-width:440px;margin:0 auto}
.stage{position:relative;border:4px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:#000;touch-action:none}
.stage canvas{display:block;width:100%;height:auto;touch-action:none}
.over{position:absolute;inset:0;background:rgba(27,31,59,.78);display:grid;place-items:center;color:#fff;text-align:center;padding:20px}
.over .big{font-size:2.6rem;font-weight:700;text-shadow:0 4px 0 #000}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.score{margin-left:auto;background:#fff;border:3px solid var(--line);border-radius:12px;padding:4px 12px;font-weight:700}
.pad{display:flex;gap:10px;margin-top:12px}
.pad .btn{flex:1;font-size:1.3rem;min-height:60px;user-select:none;-webkit-user-select:none}
/* list items */
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--soft)}
.li:last-child{border-bottom:0}
.av{width:44px;height:44px;border-radius:10px;border:3px solid var(--line);background:var(--soft);flex:none;overflow:hidden}
.av img{width:100%;height:100%;display:block}
.av.lg{width:110px;height:110px;border-radius:18px}
.name{font-weight:700;display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--ink)}
.vbadge{width:16px;height:16px;flex:none}
.plusb{background:var(--purple);color:#fff;border:2px solid var(--line);border-radius:6px;font-size:.65rem;padding:0 5px;font-weight:700}
.pill{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:700;background:var(--soft)}
.pill.pending{background:var(--yellow)} .pill.approved,.pill.paid{background:#b7f5c9} .pill.rejected,.pill.refunded{background:#ffc2c2}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 230px);min-height:320px}
.msgs{flex:1;overflow-y:auto;padding:6px 2px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:8px 12px;border:3px solid var(--line);border-radius:14px;background:#fff;word-wrap:break-word;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff}
/* shop */
.item{text-align:center}
.item canvas{width:100%;aspect-ratio:1;background:var(--soft);border-radius:10px;border:3px solid var(--line)}
/* editor */
.palette{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.palette button{border:3px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;background:#fff;cursor:pointer;display:flex;align-items:center;gap:6px}
.palette button.on{background:var(--yellow)}
.palette i{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-radius:4px}
/* toast + modal */
#toasts{position:fixed;top:calc(70px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#fff;border:3px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-weight:600;max-width:92vw;animation:pop .2s}
.toast.err{background:#ffe1e1} .toast.ok{background:#d9fbe5}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(27,31,59,.6);display:flex;align-items:flex-end;justify-content:center}
.modal .card{width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{align-items:center}.modal .card{border-radius:20px}}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border:2px solid var(--line);border-radius:8px;padding:4px 8px;word-break:break-all}
.empty{padding:24px;text-align:center;color:var(--ink2)}
.stars{color:#ffb703;letter-spacing:1px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kv div{background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:8px}
.kv b{display:block;font-size:1.3rem}
.post-body{white-space:pre-wrap;word-wrap:break-word}
.spin{width:28px;height:28px;border:4px solid var(--soft);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.color-row{display:flex;gap:10px;align-items:center}
.color-row input[type=color]{width:52px;height:44px;border:3px solid var(--line);border-radius:10px;padding:2px;background:#fff}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><i></i>Blockhub</a>
  <a class="bux" href="#/bux" id="buxBtn" hidden><span class="coin"></span><span id="buxAmt">0</span></a>
  <a class="me" href="#/login" id="meBtn" aria-label="Account"></a>
</header>
<main id="view"><div class="spin"></div></main>
<nav class="nav" id="nav">
  <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><rect x="9" y="13" width="6" height="7"/></svg>Play</a>
  <a href="#/create" data-r="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/><path d="M17 3v8M13 7h8"/></svg>Create</a>
  <a href="#/forum" data-r="forum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/></svg>Forum</a>
  <a href="#/friends" data-r="friends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="3" width="7" height="7"/><path d="M2 21v-4h13v4"/><rect x="15" y="6" width="5" height="5"/><path d="M17 15h5v6"/></svg>Social <span id="unread"></span></a>
  <a href="#/more" data-r="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>More</a>
</nav>
<div id="toasts"></div>

<script>
/* =====================================================================
   CONFIG  -  paste your Supabase project URL and anon (public) key here.
   Leave blank to enter them on the device instead (stored locally).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',
};

/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const view = $('#view');
const fmt = n => Number(n || 0).toLocaleString();
const money = c => '$' + (c / 100).toFixed(2);
function ago(t) {
  const s = (Date.now() - new Date(t)) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 604800) return Math.floor(s / 86400) + 'd';
  return new Date(t).toLocaleDateString();
}
function toast(msg, kind = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + kind; t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
const fail = e => { console.error(e); toast(e?.message || String(e), 'err'); };
function modal(html, onMount) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="card">${html}</div>`;
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  document.body.appendChild(m);
  const close = () => m.remove();
  $$('[data-close]', m).forEach(b => b.onclick = close);
  onMount && onMount(m, close);
  return close;
}
function lsGet(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } }
function lsSet(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
const VBADGE = '<svg class="vbadge" viewBox="0 0 24 24"><path fill="#2d7ff9" stroke="#1b1f3b" stroke-width="2" d="M12 1l3 3h4v4l3 3-3 3v4h-4l-3 3-3-3H5v-4l-3-3 3-3V4h4z"/><path d="M7.5 12l3 3 6-6" fill="none" stroke="#fff" stroke-width="2.5"/></svg>';
function nameTag(p, link = true) {
  if (!p) return '<span class="muted">unknown</span>';
  const inner = `${esc(p.username)}${p.verified ? VBADGE : ''}${p.plus_until && new Date(p.plus_until) > new Date() ? '<span class="plusb">PLUS</span>' : ''}`;
  return link ? `<a class="name" href="#/u/${encodeURIComponent(p.username)}">${inner}</a>` : `<span class="name">${inner}</span>`;
}
const PROFILE_COLS = 'id,username,verified,plus_until,avatar,equipped';

/* =====================================================================
   STATE + SUPABASE
   ===================================================================== */
const S = { sb: null, user: null, profile: null, bux: 0, items: {}, channel: null, unread: 0, chatWith: null, onMsg: null };
const SB_URL = CONFIG.SUPABASE_URL || lsGet('bh_url', '');
const SB_KEY = CONFIG.SUPABASE_ANON_KEY || lsGet('bh_key', '');
if (SB_URL && SB_KEY && window.supabase) {
  S.sb = window.supabase.createClient(SB_URL, SB_KEY);
}
const online = () => !!S.sb;
async function rpc(fn, args = {}) {
  const { data, error } = await S.sb.rpc(fn, args);
  if (error) throw error;
  return data;
}
async function fnCall(action, extra = {}) {
  const { data, error } = await S.sb.functions.invoke('stripe-api', { body: { action, ...extra } });
  if (error) {
    let msg = error.message;
    try { const b = await error.context.json(); msg = b.error || msg; } catch {}
    throw new Error(msg);
  }
  if (data?.error) throw new Error(data.error);
  return data;
}
function needLogin() {
  if (!online()) { location.hash = '#/setup'; return true; }
  if (!S.user) { toast('Sign in to do that'); location.hash = '#/login?next=' + encodeURIComponent(location.hash); return true; }
  return false;
}

/* =====================================================================
   AVATARS (blocky figure drawn on canvas)
   ===================================================================== */
const avCache = new Map();
function drawAvatar(c, size, avatar = {}, equipped = {}, opts = {}) {
  const s = size / 100;
  const col = { head: '#ffd23f', torso: '#2d7ff9', legs: '#2b2d42', ...avatar };
  const it = k => S.items[equipped?.[k]]?.data;
  const R = (x, y, w, h, f) => { c.fillStyle = f; c.fillRect(x * s, y * s, w * s, h * s); c.lineWidth = 3 * s; c.strokeStyle = '#1b1f3b'; c.strokeRect(x * s, y * s, w * s, h * s); };
  c.clearRect(0, 0, size, size);
  if (opts.bg !== false) { c.fillStyle = opts.bg || '#dfe7fb'; c.fillRect(0, 0, size, size); }
  // legs, arms, torso
  R(36, 72, 13, 24, col.legs); R(51, 72, 13, 24, col.legs);
  R(20, 44, 13, 28, col.head); R(67, 44, 13, 28, col.head);
  R(33, 44, 34, 30, col.torso);
  const shirt = it('shirt');
  if (shirt) {
    c.fillStyle = shirt.color;
    if (shirt.pattern === 'stripe') for (let i = 0; i < 3; i++) c.fillRect(35 * s, (49 + i * 9) * s, 30 * s, 4 * s);
    if (shirt.pattern === 'star') { c.beginPath(); for (let i = 0; i < 10; i++) { const a = Math.PI / 5 * i - Math.PI / 2, r = (i % 2 ? 5 : 11) * s; c.lineTo(50 * s + Math.cos(a) * r, 59 * s + Math.sin(a) * r); } c.fill(); }
    if (shirt.pattern === 'plus') { R(33, 44, 34, 30, shirt.color); c.fillStyle = '#fff'; c.fillRect(47 * s, 50 * s, 6 * s, 18 * s); c.fillRect(41 * s, 56 * s, 18 * s, 6 * s); }
  }
  // head
  R(34, 14, 32, 30, col.head);
  const face = it('face')?.style || 'smile';
  c.fillStyle = '#1b1f3b';
  const eye = (x, y) => c.fillRect(x * s, y * s, 4 * s, 5 * s);
  if (face === 'cool') { c.fillRect(37 * s, 23 * s, 26 * s, 6 * s); c.fillRect(42 * s, 33 * s, 16 * s, 3 * s); }
  else if (face === 'robot') { c.fillStyle = '#ff4d4d'; c.fillRect(37 * s, 23 * s, 26 * s, 6 * s); c.fillStyle = '#1b1f3b'; c.fillRect(42 * s, 34 * s, 16 * s, 3 * s); }
  else {
    eye(41, 23); if (face === 'wink') c.fillRect(54 * s, 26 * s, 6 * s, 2 * s); else eye(55, 23);
    c.lineWidth = 3 * s; c.beginPath();
    if (face === 'grin') { c.fillRect(41 * s, 32 * s, 18 * s, 6 * s); }
    else { c.arc(50 * s, 31 * s, 7 * s, .15 * Math.PI, .85 * Math.PI); c.stroke(); }
  }
  // hat
  const hat = it('hat');
  if (hat) {
    if (hat.shape === 'cap') { R(32, 8, 36, 9, hat.color); R(60, 13, 16, 5, hat.color); }
    if (hat.shape === 'tophat') { R(30, 10, 40, 6, hat.color); R(37, -6, 26, 17, hat.color); }
    if (hat.shape === 'crown') { c.fillStyle = hat.color; c.beginPath(); c.moveTo(33 * s, 15 * s); c.lineTo(33 * s, 2 * s); c.lineTo(42 * s, 9 * s); c.lineTo(50 * s, 0); c.lineTo(58 * s, 9 * s); c.lineTo(67 * s, 2 * s); c.lineTo(67 * s, 15 * s); c.closePath(); c.fill(); c.lineWidth = 3 * s; c.stroke(); }
    if (hat.shape === 'horns') { R(32, 4, 7, 11, hat.color); R(61, 4, 7, 11, hat.color); }
    if (hat.shape === 'halo') { c.strokeStyle = hat.color; c.lineWidth = 4 * s; c.beginPath(); c.ellipse(50 * s, 6 * s, 16 * s, 4 * s, 0, 0, Math.PI * 2); c.stroke(); }
  }
}
function avatarURL(p, size = 96) {
  const key = JSON.stringify([p?.avatar, p?.equipped, size, Object.keys(S.items).length]);
  if (avCache.has(key)) return avCache.get(key);
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  drawAvatar(cv.getContext('2d'), size, p?.avatar || {}, p?.equipped || {});
  const u = cv.toDataURL(); avCache.set(key, u); return u;
}
const avImg = (p, cls = '') => `<span class="av ${cls}"><img alt="" src="${avatarURL(p, cls === 'lg' ? 220 : 96)}"></span>`;

/* =====================================================================
   GAME ENGINE
   Every game gets a host `g` with W, H, setScore(n), end(), and returns
   handlers: update(dt), draw(ctx), down(x,y), move(x,y), up(x,y),
   key(k, isDown), swipe(dir).
   ===================================================================== */
const W = 360, H = 540;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));

/* ---------- Community platformer (made in the creator) ---------- */
const LW = 12, LH = 18, T = 30;

function makePlatformer(level, theme) {
  return g => {
    const tiles = cleanLevel(level), taken = new Set();
    let si = tiles.indexOf('5'); if (si < 0) si = (LH - 2) * LW + 1;
    const spawn = { x: (si % LW) * T + 5, y: Math.floor(si / LW) * T + 2 };
    let p = { ...spawn, w: 20, h: 26, vx: 0, vy: 0, on: false }, t = 0, deaths = 0, coins = 0;
    const tile = (cx, cy) => (cx < 0 || cx >= LW || cy < 0) ? 1 : cy >= LH ? 0 : +tiles[cy * LW + cx];
    const solid = v => v === 1 || v === 6;
    const scoreNow = () => Math.max(10, coins * 100 + Math.max(0, 1000 - Math.floor(t) * 10) - deaths * 20);
    const die = () => { deaths++; Object.assign(p, spawn, { vx: 0, vy: 0 }); };
    return {
      controls: true,
      update(dt) {
        t += dt; const k = g.keys;
        p.vx = ((k.right ? 1 : 0) - (k.left ? 1 : 0)) * 160;
        if (k.jump && p.on) { p.vy = -540; p.on = false; }
        p.vy = Math.min(900, p.vy + 1500 * dt);
        p.x += p.vx * dt;
        for (const cy of [Math.floor(p.y / T), Math.floor((p.y + p.h - 1) / T)]) {
          if (p.vx > 0 && solid(tile(Math.floor((p.x + p.w) / T), cy))) p.x = Math.floor((p.x + p.w) / T) * T - p.w - .01;
          if (p.vx < 0 && solid(tile(Math.floor(p.x / T), cy))) p.x = (Math.floor(p.x / T) + 1) * T;
        }
        p.y += p.vy * dt; p.on = false;
        for (const cx of [Math.floor(p.x / T), Math.floor((p.x + p.w - 1) / T)]) {
          if (p.vy > 0) { const v = tile(cx, Math.floor((p.y + p.h) / T)); if (solid(v)) { p.y = Math.floor((p.y + p.h) / T) * T - p.h; if (v === 6) p.vy = -820; else { p.vy = 0; p.on = true; } } }
          else if (p.vy < 0 && solid(tile(cx, Math.floor(p.y / T)))) { p.y = (Math.floor(p.y / T) + 1) * T; p.vy = 0; }

        }
        g.setScore(scoreNow());
      },
      draw(c) {
        drawLevel(c, tiles, theme, { taken });
        block(c, p.x, p.y, p.w, p.h, theme?.player || '#ffd23f', 2); face(c, p.x, p.y + 2, p.w);
        txt(c, `Coins ${coins}  Deaths ${deaths}  ${Math.floor(t)}s`, W / 2, 14, 13);
      } };
  };
}

/* ---------- Host: runs a game on a canvas ---------- */
function runGame(canvas, make, { onScore, onEnd } = {}) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  const c = canvas.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  let running = true, ended = false, score = 0, raf, last = performance.now();

  const pos = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
  let downAt = null, dragging = false;
  const pd = e => { if (!running) return; e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); const [x, y] = pos(e); downAt = [x, y]; dragging = true; game.down && game.down(x, y); };
  const pm = e => { if (!running || !dragging) return; const [x, y] = pos(e); game.move && game.move(x, y); };
  const pu = e => {
    if (!running || !downAt) return; dragging = false; const [x, y] = pos(e); const dx = x - downAt[0], dy = y - downAt[1];
    if (Math.hypot(dx, dy) > 24 && game.swipe) game.swipe(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));

    game.up && game.up(x, y); downAt = null;
  };
  canvas.addEventListener('pointerdown', pd); canvas.addEventListener('pointermove', pm); canvas.addEventListener('pointerup', pu); canvas.addEventListener('pointercancel', () => dragging = false);
  const keyMap = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'jump', w: 'jump', W: 'jump', ' ': 'jump' };
  const kd = e => { if (!running) return; if (keyMap[e.key] || e.key.startsWith('Arrow')) e.preventDefault(); if (keyMap[e.key]) g.keys[keyMap[e.key]] = true; game.key && game.key(e.key, true); };
  const ku = e => { if (keyMap[e.key]) g.keys[keyMap[e.key]] = false; game.key && game.key(e.key, false); };
  addEventListener('keydown', kd); addEventListener('keyup', ku);
  const loop = now => {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (running) game.update(dt);
    game.draw(c);
    if (running) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  return { g, game, stop() { running = false; cancelAnimationFrame(raf); removeEventListener('keydown', kd); removeEventListener('keyup', ku); } };
}

}
async function loadItems() {
  if (!online() || Object.keys(S.items).length) return;
  const { data } = await S.sb.from('shop_items').select('*').eq('active', true).order('price');
  (data || []).forEach(i => S.items[i.id] = i); avCache.clear();
}
async function loadMe() {
  const [{ data: p, error }, { data: w }] = await Promise.all([
    S.sb.from('profiles').select('*').eq('id', S.user.id).single(),
    S.sb.from('wallets').select('bux').eq('user_id', S.user.id).single(),
  ]);

}
function subscribeMe() {
  if (S.channel) S.sb.removeChannel(S.channel);
  const uid = S.user.id;
  S.channel = S.sb.channel('me-' + uid)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'wallets', filter: `user_id=eq.${uid}` }, ({ new: n }) => { if (n?.bux !== undefined) { S.bux = n.bux; paintTop(); } })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `recipient=eq.${uid}` }, ({ new: m }) => {
      if (S.chatWith === m.sender && S.onMsg) S.onMsg(m);
      else { S.unread++; paintTop(); toast('New message'); }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'friendships', filter: `addressee=eq.${uid}` }, () => toast('New friend request'))

}
async function afterAuth(event) {
  try {
    await loadItems();
    if (S.user) {
      await loadMe();
      subscribeMe();
      const { count } = await S.sb.from('messages').select('id', { count: 'exact', head: true }).eq('recipient', S.user.id).is('read_at', null);
      S.unread = count || 0; paintTop();
      const ref = lsGet('bh_ref');
      if (ref) { lsSet('bh_ref', null); rpc('apply_referral', { p_code: ref }).then(r => toast(`Invite bonus: +${r.bonus} Bux`, 'ok')).catch(() => {}); }
    } else {
      S.profile = null; S.bux = 0; S.unread = 0;
      if (S.channel) { S.sb.removeChannel(S.channel); S.channel = null; }
      paintTop();
    }
  } catch (e) { fail(e); }
  if (event === 'SIGNED_IN' && location.hash.startsWith('#/login')) location.hash = q('next') || '#/';
  else if (['SIGNED_IN', 'SIGNED_OUT', 'INITIAL_SESSION'].includes(event)) render();
}
function boot() {
  const ref = new URLSearchParams(location.search).get('ref');
  if (ref) lsSet('bh_ref', ref.toUpperCase());
  const ck = new URLSearchParams(location.search).get('checkout');
  if (ck) toast(ck === 'plus' ? 'Welcome to Plus! It activates in a few seconds.' : ck === 'bux' ? 'Payment done. Your gift code appears below shortly.' : 'Payment done. Your order appears shortly.', 'ok');
  if (ref || ck || new URLSearchParams(location.search).get('connect')) history.replaceState(null, '', location.pathname + location.hash);
  paintTop();
  if (!online()) { render(); return; }
  // Keep the callback synchronous. Database calls inside it can deadlock
  // the auth client, so defer them with setTimeout.
  let lastUid;
  S.sb.auth.onAuthStateChange((event, session) => {
    S.user = session?.user || null;
    const uid = S.user?.id || null;
    // supabase-js re-fires SIGNED_IN when the tab regains focus. Only react
    // when the signed-in user actually changes, so games are not reset.
    if (event !== 'INITIAL_SESSION' && uid === lastUid) return;
    lastUid = uid;
    setTimeout(() => afterAuth(event), 0);
  });
  // Keepalive: ping at most once per 12h per device so the project never idles.
  const last = +lsGet('bh_ping', 0);
  if (Date.now() - last > 432e5) { lsSet('bh_ping', String(Date.now())); S.sb.rpc('keepalive').then(() => {}, () => {}); }
}

}

function playScreen({ title, back, make, onSubmit, lbGame, extra = '' }) {
  view.innerHTML = `
  <div class="play">
    <div class="hud"><a class="btn w sm" href="${back}">Back</a><b>${esc(title)}</b><span class="score" id="sc">0</span></div>
    <div class="stage"><canvas id="cv"></canvas><div class="over" id="ov" hidden></div></div>
    <div id="padWrap"></div>
    <div class="row" style="margin-top:12px"><button class="btn y grow" id="restart">Restart</button><button class="btn w" id="fs">Full screen</button></div>
    ${extra}
    ${lbGame ? '<div class="card" style="margin-top:14px"><h3>Top scores</h3><div id="lb" class="muted">Loading...</div></div>' : ''}
  </div>`;
  let host, startedAt;
  const start = () => {
    host && host.stop(); $('#ov').hidden = true; $('#sc').textContent = '0'; startedAt = Date.now();
    host = runGame($('#cv'), make, { onScore: n => $('#sc').textContent = fmt(n), onEnd: finish });
    if (host.game.controls) {
      $('#padWrap').innerHTML = `<div class="pad"><button class="btn w" data-k="left">&#9664;</button><button class="btn y" data-k="jump">Jump</button><button class="btn w" data-k="right">&#9654;</button></div>`;
      $$('#padWrap [data-k]').forEach(b => {
        const k = b.dataset.k, on = e => { e.preventDefault(); host.g.keys[k] = true; }, off = e => { e.preventDefault(); host.g.keys[k] = false; };
        b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
        b.addEventListener('contextmenu', e => e.preventDefault());
      });
    }
  };
  const finish = async score => {
    const dur = Math.round((Date.now() - startedAt) / 1000);
    const ov = $('#ov'); if (!ov) return;
    ov.hidden = false;
    ov.innerHTML = `<div><div class="big">${fmt(score)}</div><p>Game over</p><p id="rw" class="small">${S.user ? 'Saving score...' : '<a style="color:#ffd23f" href="#/login">Sign in</a> to earn Bux and get on the board.'}</p><button class="btn y" id="again">Play again</button></div>`;
    $('#again').onclick = start;
    if (S.user && onSubmit) {
      try {
        const r = await onSubmit(score, dur);
        $('#rw') && ($('#rw').textContent = r.reward > 0 ? `+${r.reward} Bux earned!` : dur < 15 ? 'Play at least 15 seconds to earn Bux.' : 'No Bux this round (cooldown or daily cap).');
        if (r.balance != null) { S.bux = r.balance; paintTop(); }
        loadLb();
      } catch (e) { $('#rw') && ($('#rw').textContent = e.message); }
    }
  };
  const loadLb = async () => {
    if (!lbGame || !$('#lb')) return;
    if (!online()) { $('#lb').textContent = 'Connect Supabase to see scores.'; return; }
    try {
      const rows = await rpc('leaderboard', { p_game: lbGame });
      $('#lb').innerHTML = rows.length ? rows.map((r, i) => `<div class="li"><b>#${i + 1}</b><span class="grow">${nameTag(r)}</span><b>${fmt(r.best)}</b></div>`).join('') : 'No scores yet. Be first!';
    } catch (e) { $('#lb').textContent = e.message; }
  };
  $('#restart').onclick = start;
  $('#fs').onclick = () => { const el = $('.stage'); (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); };
  start(); loadLb();
  onLeave(() => host && host.stop());
}

  const gm = GAME[id]; if (!gm) { view.innerHTML = '<div class="card empty">Game not found</div>'; return; }
  playScreen({ title: gm.name, back: '#/', make: gm.make, lbGame: id,

    extra: `<p class="muted center">${esc(gm.desc)}</p>` });
}

/* ---------- Creator ---------- */
let createResume = null;
async function viewCreate(editId) {
  const resume = createResume; createResume = null;
  let level = defaultLevel(), theme = { sky: '#7cc6ff', block: '#2d7ff9', player: '#ffd23f' }, meta = { title: '', description: '' }, mine = [];
  if (editId && online()) {
    const { data, error } = await S.sb.from('community_games').select('*').eq('id', editId).single();
    if (error) throw error;
    level = { tiles: cleanLevel(data.level) }; theme = { ...theme, ...data.theme }; meta = data;
  } else {
    const draft = lsGet('bh_draft'); if (draft) try { const d = JSON.parse(draft); level = { tiles: cleanLevel(d.level) }; theme = { ...theme, ...d.theme }; } catch {}
  }
  if (resume) { level = { tiles: resume.tiles }; theme = resume.theme; meta = { ...meta, title: resume.title, description: resume.description }; }
  if (S.user) { const { data } = await S.sb.from('community_games').select('id,title,plays,published').eq('creator', S.user.id).order('updated_at', { ascending: false }); mine = data || []; }
  let tiles = level.tiles.split(''), tool = 1, testing = null;
  view.innerHTML = `
  <h1>${editId ? 'Edit game' : 'Game creator'}</h1>
  <p class="muted">Paint a one-screen obby. Place one spawn and one goal. Coins add to the score, lava resets you, pink pads bounce you high.</p>
  <div class="play">
    <div class="palette" id="pal">${TILES.map(t => `<button data-t="${t.id}" class="${t.id === tool ? 'on' : ''}"><i style="background:${t.color}"></i>${t.name}</button>`).join('')}</div>
    <div class="stage" id="edStage"><canvas id="ed"></canvas></div>
    <div class="row" style="margin-top:12px"><button class="btn g grow" id="test">Test play</button><button class="btn w" id="clear">Clear</button></div>
    <div class="card" style="margin-top:14px">
      <div class="row"><div class="color-row"><input type="color" id="cSky" value="${esc(theme.sky)}"><span>Sky</span></div><div class="color-row"><input type="color" id="cBlock" value="${esc(theme.block)}"><span>Blocks</span></div><div class="color-row"><input type="color" id="cPlayer" value="${esc(theme.player)}"><span>Player</span></div></div>
      <div style="margin-top:12px"><label for="gTitle">Title</label><input type="text" id="gTitle" maxlength="40" value="${esc(meta.title)}" placeholder="Lava Tower Escape"></div>
      <div style="margin-top:10px"><label for="gDesc">Description</label><textarea id="gDesc" maxlength="300" placeholder="Tell players what to do">${esc(meta.description || '')}</textarea></div>
      <div class="row" style="margin-top:12px"><button class="btn y grow" id="pub">${editId ? 'Save changes' : 'Publish to hub'}</button>${editId ? '<button class="btn r" id="del">Delete</button>' : ''}</div>
    </div>
    ${mine.length ? `<div class="card"><h3>My games</h3>${mine.map(m => `<div class="li"><a class="grow name" href="#/cg/${m.id}">${esc(m.title)}</a><span class="muted small">${fmt(m.plays)} plays</span><a class="btn sm w" href="#/create/${m.id}">Edit</a></div>`).join('')}</div>` : ''}
  </div>`;
  const cv = $('#ed'), dpr = Math.min(2, devicePixelRatio || 1); cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const th = () => ({ sky: $('#cSky').value, block: $('#cBlock').value, player: $('#cPlayer').value });
  const paint = () => drawLevel(c, tiles.join(''), th(), { edit: true });
  const save = () => { if (!editId) lsSet('bh_draft', JSON.stringify({ level: { tiles: tiles.join('') }, theme: th() })); };
  paint();
  $$('#pal button').forEach(b => b.onclick = () => { tool = +b.dataset.t; $$('#pal button').forEach(x => x.classList.toggle('on', x === b)); });
  ['cSky', 'cBlock', 'cPlayer'].forEach(id => $('#' + id).oninput = () => { paint(); save(); });
  let drawing = false;
  const put = e => {
    const r = cv.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * LW), y = Math.floor((e.clientY - r.top) / r.height * LH);
    if (x < 0 || y < 0 || x >= LW || y >= LH) return;
    if (tool === 5 || tool === 4) tiles = tiles.map(v => v === String(tool) ? '0' : v);
    tiles[y * LW + x] = String(tool); paint();
  };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); drawing = true; cv.setPointerCapture?.(e.pointerId); put(e); });
  cv.addEventListener('pointermove', e => drawing && put(e));
  cv.addEventListener('pointerup', () => { drawing = false; save(); });
  $('#clear').onclick = () => { if (confirm('Clear the whole level?')) { tiles = defaultLevel().tiles.split(''); paint(); save(); } };
  const valid = () => { const s = tiles.join(''); if (!s.includes('5')) return 'Place a spawn tile.'; if (!s.includes('4')) return 'Place a goal tile.'; return null; };
  $('#test').onclick = () => {
    const bad = valid(); if (bad) return toast(bad, 'err');
    const stage = $('#edStage'); stage.innerHTML = '<canvas id="tp"></canvas><div class="over" id="tov" hidden></div>';
    $('#test').textContent = 'Stop test'; $('#test').onclick = () => viewCreateResume();
    testing = runGame($('#tp'), makePlatformer({ tiles: tiles.join('') }, th()), { onEnd: s => { $('#tov').hidden = false; $('#tov').innerHTML = `<div><div class="big">${fmt(s)}</div><p>You beat your level!</p></div>`; } });
    const padHTML = `<div class="pad" id="tpad"><button class="btn w" data-k="left">&#9664;</button><button class="btn y" data-k="jump">Jump</button><button class="btn w" data-k="right">&#9654;</button></div>`;
    stage.insertAdjacentHTML('afterend', padHTML);
    $$('#tpad [data-k]').forEach(b => { const k = b.dataset.k; b.onpointerdown = e => { e.preventDefault(); testing.g.keys[k] = true; }; b.onpointerup = b.onpointerleave = b.onpointercancel = () => testing.g.keys[k] = false; });
  };
  const viewCreateResume = () => {
    testing && testing.stop(); save();
    createResume = { tiles: tiles.join(''), theme: th(), title: $('#gTitle').value, description: $('#gDesc').value };
    viewCreate(editId).catch(fail);
  };
  onLeave(() => testing && testing.stop());
  $('#pub').onclick = async () => {
    if (needLogin()) return;
    const bad = valid(); if (bad) return toast(bad, 'err');
    const title = $('#gTitle').value.trim(); if (title.length < 3) return toast('Give your game a title (3+ letters).', 'err');
    const row = { title, description: $('#gDesc').value.trim() || null, level: { tiles: tiles.join('') }, theme: th(), published: true };
    try {
      if (editId) { const { error } = await S.sb.from('community_games').update(row).eq('id', editId); if (error) throw error; toast('Saved', 'ok'); location.hash = '#/cg/' + editId; }
      else { const { data, error } = await S.sb.from('community_games').insert({ ...row, creator: S.user.id }).select('id').single(); if (error) throw error; lsSet('bh_draft', null); toast('Published!', 'ok'); location.hash = '#/cg/' + data.id; }
    } catch (e) { fail(e); }
  };
  if (editId) $('#del').onclick = async () => { if (!confirm('Delete this game for good?')) return; const { error } = await S.sb.from('community_games').delete().eq('id', editId); if (error) return fail(error); toast('Deleted'); location.hash = '#/create'; };
}

/* ---------- Bux: gift codes, packs, referrals ---------- */
async function viewBux() {
  if (needLogin()) return;
  const [{ data: codes }, { data: ledger }, stats] = await Promise.all([
    S.sb.from('gift_codes').select('code,bux,redeemed_at,created_at').eq('purchased_by', S.user.id).order('created_at', { ascending: false }),
    S.sb.from('bux_ledger').select('delta,reason,created_at').eq('user_id', S.user.id).order('created_at', { ascending: false }).limit(20),
    rpc('my_referral_stats'),

async function viewFriends() {
  if (needLogin()) return;
  const uid = S.user.id;
  const { data: fr, error } = await S.sb.from('friendships').select('*').or(`requester.eq.${uid},addressee.eq.${uid}`);
  if (error) throw error;
  const ids = [...new Set(fr.flatMap(f => [f.requester, f.addressee]).filter(x => x !== uid))];
  const { data: people } = ids.length ? await S.sb.from('profiles').select(PROFILE_COLS).in('id', ids) : { data: [] };
  const P = Object.fromEntries((people || []).map(p => [p.id, p]));
  const { data: unreadRows } = await S.sb.from('messages').select('sender').eq('recipient', uid).is('read_at', null).limit(500);
  const unreadBy = {}; (unreadRows || []).forEach(r => unreadBy[r.sender] = (unreadBy[r.sender] || 0) + 1);
  const friends = fr.filter(f => f.status === 'accepted').map(f => P[f.requester === uid ? f.addressee : f.requester]).filter(Boolean);
  const incoming = fr.filter(f => f.status === 'pending' && f.addressee === uid).map(f => P[f.requester]).filter(Boolean);
  const outgoing = fr.filter(f => f.status === 'pending' && f.requester === uid).map(f => P[f.addressee]).filter(Boolean);
  view.innerHTML = `<h1>Friends</h1>
  <div class="card"><div class="row"><input type="text" id="us" placeholder="Search players" style="flex:1;min-width:0"><button class="btn" id="usb">Search</button></div><div id="usr"></div></div>
  ${incoming.length ? `<div class="card"><h3>Requests</h3>${incoming.map(p => `<div class="li">${avImg(p)}<span class="grow">${nameTag(p)}</span><button class="btn sm g" data-acc="${p.id}">Accept</button><button class="btn sm w" data-dec="${p.id}">No</button></div>`).join('')}</div>` : ''}
  <div class="card"><h3>Friends (${friends.length})</h3>${friends.map(p => `<div class="li">${avImg(p)}<span class="grow">${nameTag(p)}</span><a class="btn sm" href="#/chat/${p.id}">Chat ${unreadBy[p.id] ? `<span class="dot">${unreadBy[p.id]}</span>` : ''}</a></div>`).join('') || '<div class="empty">No friends yet. Search above.</div>'}</div>
  ${outgoing.length ? `<div class="card"><h3>Sent</h3>${outgoing.map(p => `<div class="li">${avImg(p)}<span class="grow">${nameTag(p)}</span><span class="pill pending">pending</span></div>`).join('')}</div>` : ''}`;
  const search = async () => {
    const term = $('#us').value.trim().replace(/[%_,()]/g, ''); if (term.length < 2) return;
    const { data } = await S.sb.from('profiles').select(PROFILE_COLS).ilike('username', `%${term}%`).limit(15);
    $('#usr').innerHTML = (data || []).map(p => `<div class="li">${avImg(p)}<span class="grow">${nameTag(p)}</span></div>`).join('') || '<div class="empty">No one found</div>';
  };
  $('#usb').onclick = search; $('#us').onkeydown = e => e.key === 'Enter' && search();
  $$('[data-acc]').forEach(b => b.onclick = () => rpc('respond_friend_request', { p_from: b.dataset.acc, p_accept: true }).then(render, fail));
  $$('[data-dec]').forEach(b => b.onclick = () => rpc('respond_friend_request', { p_from: b.dataset.dec, p_accept: false }).then(render, fail));
}
async function viewChat(other) {
  if (needLogin()) return;
  const uid = S.user.id;
  const [{ data: p }, { data: msgs, error }] = await Promise.all([
    S.sb.from('profiles').select(PROFILE_COLS).eq('id', other).single(),
    S.sb.from('messages').select('*').or(`and(sender.eq.${uid},recipient.eq.${other}),and(sender.eq.${other},recipient.eq.${uid})`).order('created_at', { ascending: false }).limit(60),
  ]);
  if (error) throw error;
  view.innerHTML = `<div class="row"><a class="btn w sm" href="#/friends">Back</a>${avImg(p)}${nameTag(p)}</div>
  <div class="card chat" style="margin-top:10px"><div class="msgs" id="msgs"></div>
  <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input type="text" id="mt" maxlength="1000" placeholder="Message" style="flex:1;min-width:0"><button class="btn" id="ms">Send</button></div></div>`;
  const box = $('#msgs');
  const add = m => { box.insertAdjacentHTML('beforeend', `<div class="msg ${m.sender === uid ? 'me' : ''}">${esc(m.body)}</div>`); box.scrollTop = box.scrollHeight; };
  (msgs || []).reverse().forEach(add);
  const markRead = async () => { const { count } = await S.sb.from('messages').update({ read_at: new Date().toISOString() }, { count: 'exact' }).eq('recipient', uid).eq('sender', other).is('read_at', null); S.unread = Math.max(0, S.unread - (count || 0)); paintTop(); };
  markRead();
  S.chatWith = other; S.onMsg = m => { add(m); markRead(); };
  const send = async () => {
    const body = $('#mt').value.trim(); if (!body) return; $('#mt').value = '';
    const { data, error } = await S.sb.from('messages').insert({ sender: uid, recipient: other, body }).select().single();
    if (error) { $('#mt').value = body; return fail(error.code === '42501' ? new Error('You can only message friends.') : error); }
    add(data);
  };
  $('#ms').onclick = send; $('#mt').onkeydown = e => e.key === 'Enter' && send();
  onLeave(() => { S.chatWith = null; S.onMsg = null; });
}

    <div class="row" style="justify-content:center;margin-top:10px">${me ? '<a class="btn w" href="#/settings">Edit profile</a><a class="btn y" href="#/avatar">Avatar</a>' : S.user ? `
      <button class="btn ${isFollowing ? 'w' : ''}" id="fol">${isFollowing ? 'Unfollow' : 'Follow'}</button>
      ${fstate === 'friends' ? `<a class="btn g" href="#/chat/${p.id}">Message</a><button class="btn w sm" id="unf">Unfriend</button>` : fstate === 'sent' ? '<span class="pill pending">Request sent</span>' : `<button class="btn y" id="addf">${fstate === 'incoming' ? 'Accept friend' : 'Add friend'}</button>`}` : '<a class="btn" href="#/login">Sign in to follow</a>'}</div></div>
  ${games?.length ? `<h2 style="margin-top:16px">Games by ${esc(p.username)}</h2><div class="grid">${games.map(cg => gameCard('#/cg/' + cg.id, levelThumb(cg.level, cg.theme), cg.title, fmt(cg.plays) + ' plays')).join('')}</div>` : ''}`;
  if ($('#fol')) $('#fol').onclick = async () => {
    const { error } = isFollowing ? await S.sb.from('follows').delete().eq('follower', S.user.id).eq('followee', p.id) : await S.sb.from('follows').insert({ follower: S.user.id, followee: p.id });
    if (error) return fail(error); render();
  };
  if ($('#addf')) $('#addf').onclick = () => rpc('send_friend_request', { p_target: p.id }).then(r => { toast(r === 'friends' ? 'You are now friends!' : 'Request sent', 'ok'); render(); }, fail);
  if ($('#unf')) $('#unf').onclick = () => confirm('Remove friend?') && rpc('remove_friend', { p_other: p.id }).then(render, fail);
}

/* ---------- Account ---------- */
async function viewLogin() {
  if (!online()) return viewSetup();
  if (S.user) { location.hash = '#/'; return; }
  let mode = 'in';
  const draw = () => {
    view.innerHTML = `<div class="card" style="max-width:420px;margin:0 auto"><h1 class="center">${mode === 'in' ? 'Welcome back' : 'Join Blockhub'}</h1>
    <div class="tabs" style="justify-content:center"><button class="tab ${mode === 'in' ? 'on' : ''}" data-m="in">Sign in</button><button class="tab ${mode === 'up' ? 'on' : ''}" data-m="up">Sign up</button><button class="tab ${mode === 'link' ? 'on' : ''}" data-m="link">Email link</button></div>
    <div class="stack">${mode === 'up' ? '<div><label>Username</label><input type="text" id="un" maxlength="20" placeholder="3-20 letters, numbers, _" autocapitalize="off"></div>' : ''}
      <div><label>Email</label><input type="email" id="em" autocomplete="email"></div>
      ${mode !== 'link' ? `<div><label>Password</label><input type="password" id="pw" autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}"></div>` : ''}
      ${mode === 'up' ? `<div><label>Invite code (optional)</label><input type="text" id="rc" value="${esc(lsGet('bh_ref', ''))}" autocapitalize="characters"></div>` : ''}
      <button class="btn y block" id="go">${mode === 'in' ? 'Sign in' : mode === 'up' ? 'Create account' : 'Send me a link'}</button>
      ${mode === 'in' ? '<button class="btn w block" id="fp">Forgot password</button>' : ''}</div></div>`;
    $$('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
    $('#go').onclick = async () => {
      const email = $('#em').value.trim(); const btn = $('#go'); btn.disabled = true;
      try {
        if (mode === 'in') { const { error } = await S.sb.auth.signInWithPassword({ email, password: $('#pw').value }); if (error) throw error; }
        else if (mode === 'link') { const { error } = await S.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } }); if (error) throw error; toast('Check your email for the link', 'ok'); }
        else {
          const username = $('#un').value.trim(); if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) throw new Error('Username: 3-20 letters, numbers or _');
          const rc = $('#rc').value.trim(); if (rc) lsSet('bh_ref', rc.toUpperCase());
          const { data, error } = await S.sb.auth.signUp({ email, password: $('#pw').value, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
          if (error) throw error;
          if (!data.session) toast('Check your email to confirm your account', 'ok');
        }
      } catch (e) { fail(e); }
      btn.disabled = false;
    };
    if ($('#fp')) $('#fp').onclick = async () => { const email = $('#em').value.trim(); if (!email) return toast('Type your email first', 'err'); const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname + '#/settings' }); error ? fail(error) : toast('Reset email sent', 'ok'); };
  };
  draw();
}
async function viewSettings() {
  if (needLogin()) return;
  const p = S.profile;
  view.innerHTML = `<h1>Settings</h1><div class="card stack">
    <div><label>Username</label><input type="text" id="su" maxlength="20" value="${esc(p.username)}"></div>
    <div><label>Display name</label><input type="text" id="sd" maxlength="40" value="${esc(p.display_name || '')}"></div>
    <div><label>Bio</label><textarea id="sbio" maxlength="300">${esc(p.bio || '')}</textarea></div>
    <button class="btn y block" id="ss">Save profile</button></div>
  <div class="card stack"><div><label>New password</label><input type="password" id="np" autocomplete="new-password"></div><button class="btn w block" id="spw">Change password</button></div>
  <div class="card"><button class="btn r block" id="out">Sign out</button></div>`;
  $('#ss').onclick = async () => {
    const upd = { username: $('#su').value.trim(), display_name: $('#sd').value.trim() || null, bio: $('#sbio').value.trim() || null };
    const { error } = await S.sb.from('profiles').update(upd).eq('id', S.user.id);
    if (error) return fail(error.code === '23505' ? new Error('That username is taken') : error);
    Object.assign(S.profile, upd); paintTop(); toast('Saved', 'ok');
  };
  $('#spw').onclick = async () => { const { error } = await S.sb.auth.updateUser({ password: $('#np').value }); error ? fail(error) : toast('Password changed', 'ok'); };
  $('#out').onclick = async () => { await S.sb.auth.signOut(); location.hash = '#/'; };
}
async function viewAdmin() {
  if (needLogin()) return;
  if (!S.profile?.is_admin) { view.innerHTML = '<div class="card empty">Admins only.</div>'; return; }
  const { data: pend } = await S.sb.from('market_listings').select(`*,seller:profiles(${PROFILE_COLS})`).eq('status', 'pending').order('created_at');
  view.innerHTML = `<h1>Admin</h1>
  <div class="card"><h3>Listings waiting for review (${pend?.length || 0})</h3>${(pend || []).map(l => `<div class="li" style="flex-wrap:wrap"><div class="grow"><b>${esc(l.title)}</b> · ${money(l.price_cents)} · ${nameTag(l.seller)}<div class="small post-body">${esc(l.description)}</div>${l.image_url ? `<div class="small muted">${esc(l.image_url)}</div>` : ''}</div><button class="btn sm g" data-ok="${l.id}">Approve</button><button class="btn sm r" data-no="${l.id}">Reject</button></div>`).join('') || '<div class="empty">All clear</div>'}</div>
  <div class="card stack"><h3>Verify a user</h3><input type="text" id="vu" placeholder="username"><div class="row"><button class="btn g grow" id="vy">Verify</button><button class="btn w grow" id="vn">Remove badge</button></div></div>
  <div class="card stack"><h3>Make gift codes</h3><div class="row"><input type="number" id="gn" value="5" min="1" max="100" style="flex:1"><input type="number" id="gb" value="500" min="1" style="flex:1"></div><button class="btn y block" id="gg">Generate (count, Bux each)</button><div id="gout"></div></div>
  <div class="card stack"><h3>Adjust Bux</h3><input type="text" id="au" placeholder="username"><input type="number" id="ad" placeholder="+/- amount"><input type="text" id="ar" placeholder="reason"><button class="btn w block" id="ab">Apply</button></div>`;
  $$('[data-ok]').forEach(b => b.onclick = () => rpc('admin_review_listing', { p_listing: b.dataset.ok, p_approve: true, p_reason: null }).then(render, fail));
  $$('[data-no]').forEach(b => b.onclick = () => { const r = prompt('Reason for rejecting?'); if (r !== null) rpc('admin_review_listing', { p_listing: b.dataset.no, p_approve: false, p_reason: r }).then(render, fail); });
  $('#vy').onclick = () => rpc('admin_set_verified', { p_username: $('#vu').value.trim(), p_value: true }).then(() => toast('Verified', 'ok'), fail);
  $('#vn').onclick = () => rpc('admin_set_verified', { p_username: $('#vu').value.trim(), p_value: false }).then(() => toast('Badge removed', 'ok'), fail);
  $('#gg').onclick = async () => { try { const codes = await rpc('admin_create_gift_codes', { p_count: +$('#gn').value, p_bux: +$('#gb').value }); $('#gout').innerHTML = `<div class="code post-body">${codes.map(esc).join('\n')}</div>`; } catch (e) { fail(e); } };
  $('#ab').onclick = () => rpc('admin_adjust_bux', { p_username: $('#au').value.trim(), p_delta: +$('#ad').value, p_reason: $('#ar').value }).then(v => toast('New balance ' + fmt(v), 'ok'), fail);
}
async function viewMore() {
  const links = [['#/shop', 'Item shop', 'y'], ['#/avatar', 'My avatar', 'w'], ['#/bux', 'Bux and gift codes', 'y'], ['#/plus', 'Blockhub Plus', 'p'], ['#/market', 'Marketplace', 'g'], ['#/sell', 'Sell items', 'w'], ['#/orders', 'My orders', 'w'], ['#/create', 'Game creator', 'o'], ['#/settings', 'Settings', 'w']];
  if (S.profile?.is_admin) links.push(['#/admin', 'Admin', 'r']);
  if (!S.user) links.unshift(['#/login', 'Sign in or join', 'y']);
  view.innerHTML = `<h1>More</h1><div class="grid">${links.map(([h, t, c]) => `<a class="btn ${c}" href="${h}" style="min-height:70px">${t}</a>`).join('')}</div>`;
}
async function viewSetup() {
  view.innerHTML = `<div class="card" style="max-width:520px;margin:0 auto"><h1>Connect Supabase</h1>
  <p class="muted">The games work offline. Accounts, Bux, the forum and everything social need your Supabase project. Paste the Project URL and anon key from Supabase > Project Settings > API. They are saved on this device only. For a public deploy, put them in the CONFIG block at the top of the file instead.</p>
  <div class="stack"><div><label>Project URL</label><input type="url" id="cu" value="${esc(SB_URL)}" placeholder="https://xxxx.supabase.co"></div>
  <div><label>Anon public key</label><input type="text" id="ck" value="${esc(SB_KEY)}"></div>
  <button class="btn y block" id="csv">Save and reload</button>${lsGet('bh_url') ? '<button class="btn w block" id="crm">Forget saved keys</button>' : ''}<a class="btn w block" href="#/">Just play games</a></div></div>`;
  $('#csv').onclick = () => { lsSet('bh_url', $('#cu').value.trim()); lsSet('bh_key', $('#ck').value.trim()); location.hash = '#/'; location.reload(); };
  if ($('#crm')) $('#crm').onclick = () => { lsSet('bh_url', null); lsSet('bh_key', null); location.reload(); };
}

boot();
</script>
</body>
