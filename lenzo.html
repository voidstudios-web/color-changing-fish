<style>
/* Layout: sticky top bar, one centered column, market grid of listing cards, panels as tabbed workspaces. */
:root{
  --bg:#f6f4ff;--surface:#ffffff;--surface-2:#f1edff;--line:#e4def7;--fg:#1b1530;--muted:#665f80;
  --accent:#ff3d81;--accent-2:#e3266b;--accent-fg:#ffffff;
  --ok:#14a05c;--warn:#d97a00;--bad:#e5383b;
  --t1:#ff3d81;--t2:#00b3a4;--t3:#ff8a00;--t4:#6c4cff;--t5:#1893f5;--t6:#e8a400;
  --hero:linear-gradient(120deg,#ff3d81,#ff8a00 45%,#6c4cff);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#120f1f;--surface:#1c1830;--surface-2:#262041;--line:#342c55;--fg:#f3f0ff;--muted:#aaa2c8;
  --accent:#ff5c98;--accent-2:#ff86b2;--accent-fg:#120f1f;--ok:#3ddc8a;--warn:#ffb340;--bad:#ff6b6e;
  --t1:#ff5c98;--t2:#2fd9c8;--t3:#ffa033;--t4:#8f75ff;--t5:#4cb0ff;--t6:#ffcc33;
  --hero:linear-gradient(120deg,#d92f6d,#e07400 45%,#5a3de0);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120f1f;--surface:#1c1830;--surface-2:#262041;--line:#342c55;--fg:#f3f0ff;--muted:#aaa2c8;
  --accent:#ff5c98;--accent-2:#ff86b2;--accent-fg:#120f1f;--ok:#3ddc8a;--warn:#ffb340;--bad:#ff6b6e;
  --t1:#ff5c98;--t2:#2fd9c8;--t3:#ffa033;--t4:#8f75ff;--t5:#4cb0ff;--t6:#ffcc33;
  --hero:linear-gradient(120deg,#d92f6d,#e07400 45%,#5a3de0);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hero)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hero);color:#fff}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:10px}
.logo{color:#fff;font:800 22px/1 var(--display);letter-spacing:-.3px;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo i{font-style:normal;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#ff3d81;font-size:17px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;align-items:center}
.nav-btn{background:none;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;color:#fff;font-weight:600;opacity:.9}
.nav-btn:hover{opacity:1;background:rgb(255 255 255 / .18)}
.nav-btn[aria-current="page"]{opacity:1;background:#fff;color:#1b1530}
header .btn{background:#fff;color:#1b1530}
main{padding-block:22px 64px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.2px;margin:0}
h1{font-size:clamp(24px,4vw,34px);font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:10px 18px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
label.f{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--accent)}
textarea{min-height:84px;resize:vertical}
.check{display:flex;gap:9px;align-items:flex-start;color:var(--fg);font-size:14px}
.check input{margin-top:4px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.info{color:var(--accent)}.pill.plain{color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:10px;background:var(--hero);color:#fff;border-radius:22px;padding:28px max(22px,4vw);margin-bottom:18px}
.hero h1{font-size:clamp(28px,5vw,44px)}
.hero .search input{border:0}
.hero .search select{border:0}
.hero input,.hero select{color:var(--fg);background:var(--surface)}
.hero p{max-width:56ch;opacity:.92}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.trust b{display:block;font:700 18px/1.2 var(--mono)}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.search{display:flex;gap:8px;flex-wrap:wrap}
.search input{flex:1 1 220px}
.search select{flex:0 0 auto;width:auto}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:14px 0 18px}
.cat{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px}
.cat{border-color:color-mix(in srgb,var(--tone,var(--accent)) 45%,var(--line));color:var(--fg)}
.cat[aria-pressed="true"]{background:var(--tone,var(--accent));color:#fff;border-color:transparent}
.tile{display:grid;place-items:center;border-radius:14px;font:800 22px/1 var(--display);letter-spacing:.02em;aspect-ratio:16/7;max-width:100%;color:#fff;background:linear-gradient(135deg,var(--tone),color-mix(in srgb,var(--tone) 55%,#ffffff))}
.t1{--tone:var(--t1)}
.t2{--tone:var(--t2)}
.t3{--tone:var(--t3)}
.t4{--tone:var(--t4)}
.t5{--tone:var(--t5)}
.t6{--tone:var(--t6)}

.item{display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:border-color .15s}
.item{transition:transform .15s,border-color .15s}
.item:hover{border-color:var(--tone);transform:translateY(-2px)}
.item .title{font-weight:600;line-height:1.35}
.price{font:700 19px/1 var(--mono);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--tone,var(--accent));border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 22px/1.25 var(--mono);font-variant-numeric:tabular-nums}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));padding:10px 14px;border-radius:6px;font-size:14px}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.note.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.secret{font:500 13px/1.5 var(--mono);background:var(--surface-2);border:1px dashed var(--line);padding:9px 11px;border-radius:8px;white-space:pre-wrap;word-break:break-word}
.step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font:700 14px var(--mono)}
.step.done .num{background:var(--ok);color:#fff}
.step.locked{opacity:.55}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.qr{background:#fff;padding:8px;border-radius:8px;width:180px;max-width:100%}
.err{color:var(--bad);font-size:14px}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:50;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:9px;box-shadow:0 8px 24px rgb(0 0 0 / .25);max-width:380px;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgb(10 12 18 / .6);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.skeleton{color:var(--muted);padding:40px 0;text-align:center}
.banner{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-bottom:1px solid var(--line);font-size:13px}
.banner .wrap{padding-block:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap bar">
    <button class="logo" onclick="go('market')" aria-label="Lenzo Market home"><i>L</i>Lenzo Market</button>

</header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===================== Config ===================== */

    proof:[{k:'brand',label:'Brand',type:'text'},{k:'face',label:'Face value (USD)',type:'number'},{k:'screenshot',label:'Purchase receipt',type:'file'}]},

    proof:[{k:'portfolio',label:'Sample or preview link',type:'text'}]},

const CAT=Object.fromEntries(CATS.map((c,i)=>[c.id,{...c,tone:'t'+(i%6+1)}]));
const HIGH_RISK=['accounts','discord-accounts','discord-members','streaming','gift-cards'];
const QUIZ=[
  {q:'A buyer asks you to finish the deal on Telegram to skip fees. What do you do?',a:['Agree, it saves money','Decline and keep the deal on Lenzo','Ask for a deposit first']},
  {q:'You bought a Netflix login from another site. Can you list it?',a:['Yes, under Netflix & Streaming','Yes, if the price is low','No. Shared or resold logins are banned']},
  {q:'Which Discord Growth service is allowed?',a:['Token-joined members','Ads in real partner servers','Self-bot invites']},
  {q:'You sell a game account. What must you hand over?',a:['Only the username and password','Full access, including the original email','A screenshot']},

];

const SAMPLE=[
  ['ebooks','Pixel Art for Beginners (PDF, 120 pages)',9.99,'Written by the seller. A step by step guide to pixel art with 40 exercises.'],
  ['game-currency','10,000 Gold, EU server, hand farmed',14.50,'Hand farmed and delivered by in-game mail within 2 hours.'],
  ['streaming','Netflix gift card $30, official code with receipt',29.00,'Bought from an official retailer. Unused. Receipt checked by a Lenzo moderator.'],
  ['assets','Low-poly Forest Pack, 300 models',18.00,'Made by the seller. Commercial license included.'],

  ['courses','Unity Multiplayer Crash Course, 4h video',25.00,'Four hours of original video lessons on netcode and lobbies.'],

].map(([cat,title,price,descr],i)=>({id:'sample-'+i,cat,title,price,descr,stock:10,seller:{name:'PixelForge',seller_tier:2},created_at:new Date(Date.now()-i*864e5).toISOString()}));

/* ===================== State ===================== */
let sb=null, live=false, session=null, profile=null, aal=null;
let view='market', S={cat:'all',q:'',sort:'new',tab:null,item:null,newCat:'ebooks'};
let vf={docs:{}}; // seller application draft, kept in memory until submitted

/* ===================== Boot ===================== */
async function boot(){
  try{
    if(!window.supabase)throw new Error('no client');
    sb=supabase.createClient(SB_URL,SB_KEY);
    const r=await Promise.race([sb.from('categories').select('id').limit(1),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),7000))]);

    live=true;

  if(live){
    const {data}=await sb.auth.getSession();session=data.session;

    $('banner').innerHTML=`<div class="banner"><div class="wrap">Preview mode: this frame can't reach the Lenzo database, so you see sample listings. Accounts, buying and selling work on the hosted page.</div></div>`;

  render();
}

  if(!session){profile=null;aal=null;return}
  const {data}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();profile=data;
  const a=await sb.auth.mfa.getAuthenticatorAssuranceLevel();aal=a.data;

function authModal(mode){

  ${up?`<label class="check"><input type="checkbox" id="a-age"> I am 18 or older and accept the Lenzo terms.</label>`:''}
  <div id="a-err" class="err" hidden></div>
  <div class="row"><button class="btn" id="a-go" onclick="${up?'signUp()':'signIn()'}">${up?'Create account':'Sign in'}</button><span class="spacer"></span>
  <a href="#" onclick="authModal('${up?'in':'up'}');return false">${up?'I already have an account':'Create a Lenzo account'}</a></div>`);
}
function authErr(m){const e=$('a-err');e.textContent=m;e.hidden=false;$('a-go')&&($('a-go').disabled=false)}
async function signUp(){
  const name=val('a-name'),email=val('a-email').toLowerCase(),pass=$('a-pass').value;
  if(!/^[A-Za-z0-9_.-]{3,24}$/.test(name))return authErr('Display name: 3-24 letters, numbers, dots, dashes or underscores.');
  if(pass.length<10||!/\d/.test(pass)||!/[a-z]/i.test(pass))return authErr('Password needs 10+ characters with a letter and a number.');
  if(!$('a-age').checked)return authErr('You must be 18+ and accept the terms.');
  const taken=await sb.from('profiles').select('id').ilike('name',name).maybeSingle();
  if(taken.data)return authErr('That display name is taken.');
  $('a-go').disabled=true;
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{name},emailRedirectTo:location.href.split('#')[0]}});
  if(error)return authErr(error.message);
  if(!data.session)modal(`<h2>Check your email</h2><p>We sent a confirmation link to <b>${esc(email)}</b>. Open it to activate your Lenzo account, then sign in.</p><div class="row"><button class="btn" onclick="authModal('in')">Go to sign in</button></div>`);
  else{closeModal();toast('Welcome to Lenzo, '+esc(name)+'.')}
}
async function signIn(){
  const email=val('a-email').toLowerCase(),pass=$('a-pass').value;
  $('a-go').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error)return authErr(error.message==='Email not confirmed'?'Confirm your email first. Check your inbox for the link.':error.message);
  await loadMe();
  if(profile?.banned){await sb.auth.signOut();return authErr('This Lenzo account is banned.')}
  if(aal?.nextLevel==='aal2'&&aal.currentLevel!=='aal2')return mfaModal();
  closeModal();toast('Signed in as '+esc(profile?.name));render();
}
function mfaModal(){
  modal(`<h2>Two-factor code</h2><p class="muted">Open your authenticator app and enter the 6-digit code for Lenzo.</p>
  <input id="m-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456">
  <div id="a-err" class="err" hidden></div><div class="row"><button class="btn" id="a-go" onclick="mfaVerify()">Verify</button></div>`);
}
async function mfaVerify(){
  const f=(await sb.auth.mfa.listFactors()).data?.totp?.[0];
  if(!f)return authErr('No authenticator is set up on this account.');
  const {error}=await sb.auth.mfa.challengeAndVerify({factorId:f.id,code:val('m-code')});
  if(error)return authErr('Wrong code. Try the newest code in your app.');
  await loadMe();closeModal();toast('Signed in with two-factor authentication.');render();
}
async function signOut(){await sb.auth.signOut();profile=null;session=null;vf={docs:{}};go('market')}

async function fetchListings(){

  let p=sb.from('listings').select('id,cat,title,descr,price,stock,created_at,seller:profiles!listings_seller_id_fkey(name,seller_tier,banned)').eq('status','live').gt('stock',0).limit(60);

async function upload(file,kind){
  if(file.size>8*1024*1024)throw new Error('Files must be 8 MB or smaller.');
  if(file.size<20*1024)throw new Error('That file is too small to read. Upload a clear photo.');
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
  const path=`${uid()}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from('verification').upload(path,file,{contentType:file.type});
  if(error)throw error;return path;
}
async function submitListing(){
  const c=CAT[val('n-cat')],e=$('n-err'),btn=$('n-go');

  btn.disabled=true;e.hidden=true;

async function enroll(){
  try{
    const f=(await sb.auth.mfa.listFactors()).data;
    for(const x of (f?.all||[]).filter(x=>x.status==='unverified'))await sb.auth.mfa.unenroll({factorId:x.id});

    $('mfa-box').innerHTML=`<div class="row" style="align-items:flex-start;gap:16px"><img class="qr" src="${data.totp.qr_code}" alt="QR code for your authenticator app">

  }catch(e){fail(e)}
}
async function verifyEnroll(fid){

  await loadMe();toast('Two-factor authentication is on.');render();

async function saveId(){
  const e=$('v-err'),b=$('v-go');const err=m=>{e.textContent=m;e.hidden=false;b.disabled=false};
  const legal=val('v-legal'),dob=val('v-dob'),phone=val('v-phone').replace(/[\s()-]/g,'');
  if(!/^[\p{L}'-]+( [\p{L}'-]+)+$/u.test(legal))return err('Enter your first and last name as shown on your ID.');
  if(!dob)return err('Enter your date of birth.');
  const age=(Date.now()-new Date(dob))/(365.25*864e5);if(age<18)return err('You must be 18 or older to sell on Lenzo.');
  if(!val('v-country')||!val('v-idtype'))return err('Choose your country and ID type.');
  if(!/^\+\d{8,15}$/.test(phone))return err('Enter a mobile number with country code, like +15551234567.');
  const keys=['id_front','id_back','selfie','address'];
  if(keys.some(k=>!$('v-'+k).files[0]))return err('Upload all 4 documents.');
  b.disabled=true;b.textContent='Uploading…';
  try{const docs={};for(const k of keys)docs[k]=await upload($('v-'+k).files[0],'kyc-'+k);
    vf={...vf,legal,dob,country:val('v-country'),idType:val('v-idtype'),phone,docs};render();}
  catch(x){b.textContent='Upload and continue';err(x.message)}
}

  vf.quiz=ans;render();
}
